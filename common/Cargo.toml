[package]
name = "common"
version = "0.2.0"
edition = "2024"
license = "MIT"

# Shared between the backend (encoding, solving, generating) and the frontend (playing).
# Must stay wasm-compatible: no std::time, no filesystem, no heavy dependencies.

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
# Property tests (tests/props.rs)
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
