[package]
name = "sat_solver"
version = "0.1.0"
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.7", features = ["cargo"], optional = true }
flame = { version = "0.2.2", optional = true }

[features]
default = ["cli", "flamegraph"]
# The command line `sat` (`cli::cli`, clap). The backend only uses the solvers.
cli = ["dep:clap"]
# Profiling with --flamegraph, flame doesn't build for wasm
flamegraph = ["dep:flame"]

[lib]
name = "sat_solver"
path = "src/lib.rs"

[[bin]]
name = "sat"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[lints]
workspace = true

[dev-dependencies]
# Property tests (tests/props.rs): the solvers against trying every assignment
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# CLI tests (tests/cli.rs): their files
tempfile = "3.27.0"
