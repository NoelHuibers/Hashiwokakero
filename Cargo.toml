[package]
name = "hashi"
version = "2.0.0"
edition = "2024"
license = "MIT"

[workspace]
members = ["backend", "common", "dojo", "dojo/house", "sat_solver"]
exclude = ["dojo/starter"]

# As strict as is sensible: everything in clippy's pedantic and nursery groups, CI fails on any
# warning. The few lints switched off below don't fit this code base, each with its reason.
[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Leptos components are long `view!` trees, splitting them only for the line count hurts
too_many_lines = "allow"
# Would put #[must_use] on nearly every getter and constructor
must_use_candidate = "allow"
# Errors and panics are documented where they matter, not as a section on every function
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Nursery: `const fn` everywhere constrains future changes for no benefit here
missing_const_for_fn = "allow"
# Nursery: `map_or_else` with two closures often reads worse than `if let`
option_if_let_else = "allow"
# Nursery: contradicts `unreachable_pub` above, which we prefer
redundant_pub_crate = "allow"
# Nursery: WebAssembly has no fused multiply-add, `mul_add` is slower there
suboptimal_flops = "allow"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
common = { path = "./common" }
# The SAT Dojo: only its result types here, the worker runs submissions
dojo = { path = "./dojo" }
leptos = "0.8.22"
leptos_meta = "0.8.7"
leptos_router = "0.8.17"
# Translations, compile time checked (locales/<lang>/<namespace>.json, see build.rs)
leptos_i18n = "0.6.2"
leptos_i18n_router = "0.6.2"
leptos_ui = "0.3.22"
tw_merge = { version = "0.1.22", features = ["variant"] }
strum = { version = "0.28.0", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
web-sys = { version = "0.3.106", features = [
  "AudioContext",
  "AudioContextState",
  "AudioDestinationNode",
  "AudioNode",
  "AudioParam",
  "AudioScheduledSourceNode",
  "BaseAudioContext",
  "BiquadFilterNode",
  "BiquadFilterType",
  "DelayNode",
  "GainNode",
  "OscillatorNode",
  "OscillatorType",
  "Blob",
  "BlobPropertyBag",
  "Clipboard",
  "CssStyleDeclaration",
  "DomRect",
  "DomTokenList",
  "DataTransfer",
  "Document",
  "Element",
  "File",
  "FocusEvent",
  "FileList",
  "HtmlAnchorElement",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "MediaQueryList",
  "Navigator",
  "Node",
  "PointerEvent",
  "Storage",
  "Url",
  "VisibilityState",
  "Window",
] }
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"

# Client only
console_error_panic_hook = { version = "0.1.7", optional = true }

# Server only
argon2 = { version = "0.6.0", optional = true }
axum = { version = "0.8.9", features = ["multipart"], optional = true }
backend = { path = "./backend", optional = true }
getrandom = { version = "0.4.3", optional = true }
leptos_axum = { version = "0.8.10", optional = true }
# Turso (libSQL): remote databases in production, a local file in development and tests
# Sends Dojo jobs to the worker
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"], optional = true }
# Mails from the contact form, over SMTP (Proton Mail in production)
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-tls"], optional = true }
libsql = { version = "0.10.0", default-features = false, features = ["core", "remote", "tls"], optional = true }
sha2 = { version = "0.11.1", optional = true }
# Hashing the code of Dojo submissions without their custom sections
wasmparser = { version = "0.262", optional = true }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "sync"], optional = true }
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-br"], optional = true }

[features]
hydrate = [
  "leptos/hydrate",
  "leptos_i18n/hydrate",
  "leptos_i18n_build/hydrate",
  "dep:console_error_panic_hook",
]
ssr = [
  "dep:argon2",
  "dep:axum",
  "dep:backend",
  "dep:getrandom",
  "dep:leptos_axum",
  "dep:lettre",
  "dep:libsql",
  "dep:reqwest",
  "dep:wasmparser",
  "dep:sha2",
  "dep:tokio",
  "dep:tower-http",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "leptos_i18n/axum",
  "leptos_i18n_router/ssr",
  "leptos_i18n_build/ssr",
]

[build-dependencies]
leptos_i18n_build = "0.6.2"

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

# The solvers are slow without optimizations, even during development
[profile.dev.package.sat_solver]
opt-level = 3

[profile.dev.package.splr]
opt-level = 3

[package.metadata.leptos]
# The name used by wasm-bindgen/cargo-leptos for the JS/WASM bundle. Defaults to the crate name
output-name = "hashi"
# The site root folder is where cargo-leptos generate all output. WARNING: all content of this folder will be erased on a rebuild. Use it in your server setup.
site-root = "target/site"
# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
site-pkg-dir = "pkg"
# Content hashes in the JS/WASM/CSS file names (hashi.<hash>.css), listed in hash.txt next to the
# server binary. Every deploy gets new URLs, so browsers never keep a stale stylesheet, and the
# server can send them with long-lived cache headers (see main.rs).
hash-files = true
# Tailwind v4 entry point, configured in CSS. It imports tw-animate-css from node_modules (npm ci).
tailwind-input-file = "style/tailwind.css"
# Rebuild when translations change
watch-additional-files = ["locales"]
# Assets source dir. All files found here will be copied and synchronized to site-root.
assets-dir = "public"
# The IP and port (ex: 127.0.0.1:3000) where the server serves the content. Use it in your server setup.
site-addr = "127.0.0.1:3000"
# The port to use for automatic reload monitoring. Make sure this port is not the same as the port used in site-address.
reload-port = 3001
# The browserlist query used for optimizing the CSS.
browserquery = "defaults"
# The environment Leptos will run in, usually either "DEV" or "PROD"
env = "DEV"
# The features to use when compiling the bin target
bin-features = ["ssr"]
# If the --no-default-features flag should be used when compiling the bin target
bin-default-features = false
# The features to use when compiling the lib target
lib-features = ["hydrate"]
# If the --no-default-features flag should be used when compiling the lib target
lib-default-features = false
# The profile to use for the lib target when compiling for release
lib-profile-release = "wasm-release"
