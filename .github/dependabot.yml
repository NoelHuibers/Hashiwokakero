version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Leptos crates and their wasm tooling have to move together
      leptos:
        patterns:
          - "leptos*"
          - "server_fn*"
          - "wasm-bindgen*"
          - "web-sys"
          - "js-sys"
          - "tw_merge"
      # The dojo's sandbox: wiggle is pinned exactly, all three only compile at the same version
      wasmtime:
        patterns:
          - "wasmtime*"
          - "wiggle*"
      rust-minor-and-patch:
        update-types:
          - minor
          - patch

  # The Android app's Tauri crate, outside the workspace with its own Cargo.lock
  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: weekly
    groups:
      # Tauri's crates have to move together (and with tauri-cli, pinned in ci.yml)
      tauri:
        patterns:
          - "tauri*"
      rust-minor-and-patch:
        update-types:
          - minor
          - patch

  # Its Android project: the Gradle wrapper, the Android Gradle and Kotlin plugins, AndroidX
  - package-ecosystem: gradle
    directory: /app/src-tauri/gen/android
    schedule:
      interval: weekly
    groups:
      android-gradle:
        patterns:
          - "com.android.tools.build:*"
          - "org.jetbrains.kotlin*"
      gradle-minor-and-patch:
        update-types:
          - minor
          - patch

  # Reads and updates pnpm-lock.yaml
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tw-animate-css"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
