name: Store listing
# The app's listings on Google Play and the App Store (app/README.md, Store listings): the texts in
# fastlane/metadata, the images made by store/capture (the built site on a seeded local database,
# every language, framed by store/templates), uploaded with fastlane (fastlane/Fastfile). And the
# Galaxy Store's, the same texts and phone screenshots, with scripts/galaxy-store.ts, the Amazon
# Appstore's, the same texts and the 7" tablet screenshots, with scripts/amazon-appstore.ts, and
# Huawei AppGallery's, the same texts and phone screenshots, with scripts/huawei-appgallery.ts,
# and the Microsoft Store's, the same texts and the desktop screenshots, with
# scripts/microsoft-store.ts.
#
# A pull request that changes them checks the texts (store/validate.ts and its tests), makes every
# image and keeps them as the artifact "store-listing-images" to look at, and checks them against
# the Galaxy Store's, the Amazon Appstore's, AppGallery's and the Microsoft Store's rules. It
# uploads nothing.
#
# By hand (Actions, Store listing, Run workflow, or
# `gh workflow run store-listing.yml -f platform=both -f what=all`):
# - platform: play, apple, both (the two), galaxy (the Galaxy Store), amazon (the Amazon Appstore),
#   huawei (Huawei AppGallery) or microsoft (the Microsoft Store)
# - what: text, images or all
# - validate_only: Google Play checks the listing without saving it (App Store Connect, the Galaxy
#   Store, the Amazon Appstore, AppGallery and the Microsoft Store have no such check: their upload
#   is skipped, the local checks run)
# - play_version_code: the release of the internal track supply hangs the listing on, when the
#   track has more than one
# Only the listing is uploaded: no binary, release, track, review, age rating, privacy labels,
# data safety, price or release setting is touched (fastlane/Fastfile).
on:
  pull_request:
    paths:
      - .github/workflows/store-listing.yml
      - fastlane/**
      - store/**
      # The achievements have their own workflow (achievements.yml)
      - '!store/achievements/**'
      - '!store/templates/hanko.html'
      - '!store/capture/achievements.icons.ts'
      - '!store/capture/icons.config.ts'
      - scripts/tests/store-listing.test.ts
      - public/icon-512.png
      - app/store/amazon/**
      - scripts/huawei-appgallery.ts
      - scripts/microsoft-store.ts
  workflow_dispatch:
    inputs:
      platform:
        description: The store
        type: choice
        options: [both, play, apple, galaxy, amazon, huawei, microsoft]
        default: both
      what:
        description: What to upload
        type: choice
        options: [all, text, images]
        default: all
      validate_only:
        description: Google Play only checks the listing, saves nothing (the App Store, Galaxy Store, Amazon Appstore, AppGallery and Microsoft Store uploads are skipped)
        type: boolean
        default: false
      play_version_code:
        description: Google Play, the internal track's release to use (empty for its only one)
        type: string
        default: ''

# One run per ref; an upload is never cancelled halfway
concurrency:
  group: store-listing-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The texts against the stores' limits and rules, and the tests of those checks
  validate:
    name: Validate store texts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node store/validate.ts
      - run: node --test scripts/tests/store-listing.test.ts
      # The texts against the Galaxy Store's limits (sends nothing)
      - run: node scripts/galaxy-store.ts listing --dry-run
      # And the Amazon Appstore's (sends nothing)
      - run: node scripts/amazon-appstore.ts listing --dry-run
      # And AppGallery's (sends nothing)
      - run: node scripts/huawei-appgallery.ts listing --dry-run
      # And the Microsoft Store's (sends nothing)
      - run: node scripts/microsoft-store.ts listing --dry-run
      - name: Upload tree (texts)
        run: node store/assemble.ts --text

  # The site's release build, as CI's "Build site" jobs make it: the server and the browser's half,
  # for the images (not for texts only). The same job ids as there, so they start from the Rust
  # cache main's CI saves (rust-cache keys on the job id).
  build:
    name: Build site for the images (server)
    if: github.event_name == 'pull_request' || inputs.what != 'text'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Install cargo-leptos
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y cargo-leptos@0.3.11
      - name: Build
        run: cargo leptos build --release --cargo-locked --server-only
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/hashi dist/
          tar -cf server.tar dist
      - uses: actions/upload-artifact@v7
        with:
          name: store-site-server
          path: server.tar
          retention-days: 1

  build-browser:
    name: Build site for the images (browser)
    if: github.event_name == 'pull_request' || inputs.what != 'text'
    runs-on: ubuntu-24.04
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # Its postinstall writes the fonts to public/fonts (scripts/fonts.ts)
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Install cargo-leptos
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y cargo-leptos@0.3.11
      - name: Build
        run: cargo leptos build --release --cargo-locked --frontend-only
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/hash.txt dist/
          cp -r target/site dist/site
          tar -cf browser.tar dist
      - uses: actions/upload-artifact@v7
        with:
          name: store-site-browser
          path: browser.tar
          retention-days: 1

  # Every scene in every language, phone, tablet and desktop, framed for each store, in the Playwright
  # image the browser tests use (its Chromium and fonts). The languages split over five runners
  # (Playwright's --shard, four languages each, side by side on the runner's four cores): on one
  # runner the twenty took over 40 minutes.
  capture:
    name: Store images (${{ matrix.shard }}/5)
    needs: [validate, build, build-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.build-browser.outputs.playwright }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # No fonts needed, the site in the artifact has them
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: store-site-*
          merge-multiple: true
      - run: tar -xf server.tar && tar -xf browser.tar
      - name: Take the screenshots
        run: pnpm run store:images --shard=${{ matrix.shard }}/5
        env:
          E2E_BIN: dist/hashi
          E2E_SITE_ROOT: dist/site
      - uses: actions/upload-artifact@v7
        with:
          name: store-images-${{ matrix.shard }}
          path: target/store/images
          retention-days: 1
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: store-listing-logs-${{ matrix.shard }}
          path: |
            target/store/test-results
            e2e/.run/*.log
          include-hidden-files: true
          retention-days: 3

  # The shards' images as one artifact, "store-listing-images", for the uploads below. Then the
  # upload tree, which checks that every language has its images, their sizes and that none has an
  # alpha channel.
  images:
    name: Store images
    needs: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8
        with:
          pattern: store-images-*
          path: target/store/images
          merge-multiple: true
      - name: Upload tree (texts and images)
        run: |
          node store/assemble.ts
          {
            echo "### Store images"
            echo
            echo "Every language's images are in the artifact \`store-listing-images\`: \`<language>/<frame>/<n>-<scene>.png\`"
            echo "(\`iphone-69\`, \`ipad-13\`, \`play-phone\`, \`play-tablet-7\`, \`play-tablet-10\`, \`desktop\`) and \`<language>/feature.png\`."
            echo
            echo "| Language | Images |"
            echo "|---|---|"
            for dir in target/store/images/*/; do
              echo "| $(basename "$dir") | $(find "$dir" -name '*.png' | wc -l) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: store-listing-images
          path: target/store/images
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 3 }}

  # Google Play: the listing of rs.hashi with supply, the service account's key in a file of the
  # runner's temp dir, deleted at the end
  play:
    name: Upload to Google Play
    if: >-
      always() && github.event_name == 'workflow_dispatch' && (inputs.platform == 'both' || inputs.platform == 'play') &&
      needs.validate.result == 'success' && (inputs.what == 'text' || needs.images.result == 'success')
    needs: [validate, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - if: inputs.what != 'text'
        uses: actions/download-artifact@v8
        with:
          name: store-listing-images
          path: target/store/images
      - run: node store/assemble.ts ${{ inputs.what == 'text' && '--text' || '' }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: fastlane
      - name: The service account's key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::No PLAY_SERVICE_ACCOUNT_JSON secret"
            exit 1
          fi
          umask 077
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
      - name: supply
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
          PLAY_JSON_KEY: ${{ runner.temp }}/play.json
          WHAT: ${{ inputs.what }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
          VERSION_CODE: ${{ inputs.play_version_code }}
        run: |
          args=(what:"$WHAT" validate_only:"$VALIDATE_ONLY")
          if [ -n "$VERSION_CODE" ]; then args+=(version_code:"$VERSION_CODE"); fi
          bundle exec fastlane android listing "${args[@]}"
          if [ "$VALIDATE_ONLY" = true ]; then
            echo "Google Play: the listing ($WHAT) passed Play's checks, nothing was saved" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Google Play: the listing ($WHAT) of rs.hashi is updated in 25 locales" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        run: rm -f "$RUNNER_TEMP/play.json"

  # The App Store: the listing of the version in "Prepare for Submission" with deliver, the App
  # Store Connect API key as fastlane's JSON in the runner's temp dir, deleted at the end
  apple:
    name: Upload to App Store Connect
    if: >-
      always() && github.event_name == 'workflow_dispatch' && (inputs.platform == 'both' || inputs.platform == 'apple') &&
      needs.validate.result == 'success' && (inputs.what == 'text' || needs.images.result == 'success')
    needs: [validate, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - if: inputs.validate_only
        run: |
          echo "::notice::validate_only: App Store Connect has no dry run, nothing is uploaded; the texts and images passed the local checks"
          echo "App Store: validate_only, nothing uploaded (the local checks passed)" >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !inputs.validate_only }}
        uses: actions/checkout@v7
      - if: ${{ !inputs.validate_only }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - if: ${{ !inputs.validate_only && inputs.what != 'text' }}
        uses: actions/download-artifact@v8
        with:
          name: store-listing-images
          path: target/store/images
      - if: ${{ !inputs.validate_only }}
        run: node store/assemble.ts ${{ inputs.what == 'text' && '--text' || '' }}
      - if: ${{ !inputs.validate_only }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: fastlane
      - if: ${{ !inputs.validate_only }}
        name: The API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::The APPLE_API_KEY_ID, APPLE_API_ISSUER and APPLE_API_KEY_P8 secrets are needed"
            exit 1
          fi
          umask 077
          # fastlane's API key JSON (docs.fastlane.tools/app-store-connect-api)
          node -e '
            const fs = require("fs");
            fs.writeFileSync(process.argv[1], JSON.stringify({
              key_id: process.env.APPLE_API_KEY_ID,
              issuer_id: process.env.APPLE_API_ISSUER,
              key: process.env.APPLE_API_KEY_P8,
              in_house: false,
            }));
          ' "$RUNNER_TEMP/asc-key.json"
      - if: ${{ !inputs.validate_only }}
        name: deliver
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
          APPLE_API_KEY_JSON: ${{ runner.temp }}/asc-key.json
          WHAT: ${{ inputs.what }}
        run: |
          bundle exec fastlane ios listing what:"$WHAT"
          echo "App Store: the listing ($WHAT) of the version being prepared is updated in 26 locales, not submitted" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: rm -f "$RUNNER_TEMP/asc-key.json"

  # The Galaxy Store (docs/stores.md, Galaxy Store): the texts (title, description) in Samsung's
  # languages and, unless text, the icon and the phone screenshots, into the app's open update or a
  # new one, with scripts/galaxy-store.ts. Not submitted: the next release submits it with its
  # binaries (or Seller Portal does). A pull request and validate_only: Samsung's rules checked
  # against the texts and this run's images, nothing sent.
  galaxy:
    name: Upload to Galaxy Store
    if: >-
      always() && needs.validate.result == 'success' && (
      (github.event_name == 'pull_request' && needs.images.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.platform == 'galaxy' &&
      (inputs.what == 'text' || needs.images.result == 'success')))
    needs: [validate, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EVENT: ${{ github.event_name }}
      WHAT: ${{ inputs.what }}
      VALIDATE_ONLY: ${{ inputs.validate_only }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - if: github.event_name == 'pull_request' || inputs.what != 'text'
        uses: actions/download-artifact@v8
        with:
          name: store-listing-images
          path: target/store/images
      - name: Upload
        env:
          SAMSUNG_SERVICE_ACCOUNT_ID: ${{ secrets.SAMSUNG_SERVICE_ACCOUNT_ID }}
          SAMSUNG_PRIVATE_KEY: ${{ secrets.SAMSUNG_PRIVATE_KEY }}
          SAMSUNG_CONTENT_ID: ${{ secrets.SAMSUNG_CONTENT_ID }}
        run: |
          args=(listing)
          if [ "$EVENT" = pull_request ] || [ "$WHAT" != text ]; then args+=(--images target/store/images); fi
          if [ "$EVENT" = pull_request ] || [ "$VALIDATE_ONLY" = true ]; then
            args+=(--dry-run)
          elif [ -z "$SAMSUNG_SERVICE_ACCOUNT_ID" ] || [ -z "$SAMSUNG_PRIVATE_KEY" ] || [ -z "$SAMSUNG_CONTENT_ID" ]; then
            echo "::error::The SAMSUNG_SERVICE_ACCOUNT_ID, SAMSUNG_PRIVATE_KEY and SAMSUNG_CONTENT_ID secrets are needed"
            exit 1
          fi
          node scripts/galaxy-store.ts "${args[@]}"

  # The Amazon Appstore (docs/stores.md, Amazon Appstore): the texts (title, short and long
  # description, feature bullets) in Amazon's languages and, unless text, the icons, the
  # promotional image (Play's feature graphic) and the 7" tablet screenshots, into the app's open
  # edit or a new one, with scripts/amazon-appstore.ts. Not submitted: the next release commits it
  # with its binaries (or the Developer Console does). A pull request and validate_only: Amazon's
  # rules checked against the texts and this run's images, nothing sent.
  amazon:
    name: Upload to Amazon Appstore
    if: >-
      always() && needs.validate.result == 'success' && (
      (github.event_name == 'pull_request' && needs.images.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.platform == 'amazon' &&
      (inputs.what == 'text' || needs.images.result == 'success')))
    needs: [validate, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EVENT: ${{ github.event_name }}
      WHAT: ${{ inputs.what }}
      VALIDATE_ONLY: ${{ inputs.validate_only }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - if: github.event_name == 'pull_request' || inputs.what != 'text'
        uses: actions/download-artifact@v8
        with:
          name: store-listing-images
          path: target/store/images
      - name: Upload
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_APP_ID: ${{ secrets.AMAZON_APP_ID }}
        run: |
          args=(listing)
          if [ "$EVENT" = pull_request ] || [ "$WHAT" != text ]; then args+=(--images target/store/images); fi
          if [ "$EVENT" = pull_request ] || [ "$VALIDATE_ONLY" = true ]; then
            args+=(--dry-run)
          elif [ -z "$AMAZON_CLIENT_ID" ] || [ -z "$AMAZON_CLIENT_SECRET" ] || [ -z "$AMAZON_APP_ID" ]; then
            echo "::error::The AMAZON_CLIENT_ID, AMAZON_CLIENT_SECRET and AMAZON_APP_ID secrets are needed"
            exit 1
          fi
          node scripts/amazon-appstore.ts "${args[@]}"

  # Huawei AppGallery (docs/stores.md, Huawei AppGallery): the texts (title, short and full
  # description) in AppGallery's languages and, unless text, the icon and the phone screenshots,
  # into the app's version being prepared, with scripts/huawei-appgallery.ts. Not submitted: the
  # next release submits it with its packages (or AppGallery Connect does). A pull request and
  # validate_only: AppGallery's rules checked against the texts and this run's images, nothing sent.
  huawei:
    name: Upload to Huawei AppGallery
    if: >-
      always() && needs.validate.result == 'success' && (
      (github.event_name == 'pull_request' && needs.images.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.platform == 'huawei' &&
      (inputs.what == 'text' || needs.images.result == 'success')))
    needs: [validate, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EVENT: ${{ github.event_name }}
      WHAT: ${{ inputs.what }}
      VALIDATE_ONLY: ${{ inputs.validate_only }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - if: github.event_name == 'pull_request' || inputs.what != 'text'
        uses: actions/download-artifact@v8
        with:
          name: store-listing-images
          path: target/store/images
      - name: Upload
        env:
          HUAWEI_SERVICE_ACCOUNT_JSON: ${{ secrets.HUAWEI_SERVICE_ACCOUNT_JSON }}
        run: |
          args=(listing)
          if [ "$EVENT" = pull_request ] || [ "$WHAT" != text ]; then args+=(--images target/store/images); fi
          if [ "$EVENT" = pull_request ] || [ "$VALIDATE_ONLY" = true ]; then
            args+=(--dry-run)
          elif [ -z "$HUAWEI_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::The HUAWEI_SERVICE_ACCOUNT_JSON secret is needed"
            exit 1
          fi
          node scripts/huawei-appgallery.ts "${args[@]}"

  # The Microsoft Store (docs/stores.md, Microsoft Store): the texts (description, short
  # description, features) in the Store's languages and, unless text, the desktop screenshots,
  # into the app's next submission (the draft, or a new one), with scripts/microsoft-store.ts. Not
  # submitted: the next release commits it with its package (or Partner Center does). A pull
  # request and validate_only: the Store's rules checked against the texts and this run's images,
  # nothing sent.
  microsoft:
    name: Upload to Microsoft Store
    if: >-
      always() && needs.validate.result == 'success' && (
      (github.event_name == 'pull_request' && needs.images.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.platform == 'microsoft' &&
      (inputs.what == 'text' || needs.images.result == 'success')))
    needs: [validate, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EVENT: ${{ github.event_name }}
      WHAT: ${{ inputs.what }}
      VALIDATE_ONLY: ${{ inputs.validate_only }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - if: github.event_name == 'pull_request' || inputs.what != 'text'
        uses: actions/download-artifact@v8
        with:
          name: store-listing-images
          path: target/store/images
      - name: Upload
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_APP_ID: ${{ vars.MS_STORE_APP_ID }}
        run: |
          args=(listing)
          if [ "$EVENT" = pull_request ] || [ "$WHAT" != text ]; then args+=(--images target/store/images); fi
          if [ "$EVENT" = pull_request ] || [ "$VALIDATE_ONLY" = true ]; then
            args+=(--dry-run)
          elif [ -z "$MS_STORE_TENANT_ID" ] || [ -z "$MS_STORE_CLIENT_ID" ] || [ -z "$MS_STORE_CLIENT_SECRET" ] || [ -z "$MS_STORE_APP_ID" ]; then
            echo "::error::The MS_STORE_TENANT_ID, MS_STORE_CLIENT_ID and MS_STORE_CLIENT_SECRET secrets and the MS_STORE_APP_ID variable are needed"
            exit 1
          fi
          node scripts/microsoft-store.ts "${args[@]}"
