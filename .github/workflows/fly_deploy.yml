# For more details, see: https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Deploy to Fly.io
on:
  push:
    branches:
      - main
# One run at a time, the site and the dojo worker included: both build on the same Fly remote
# builder, which runs out of memory and hits its deadline building two images at once. Per-job
# groups weren't enough, the worker of one run overlapped the site of the next. A newer push
# replaces a waiting run, which is fine, it deploys a newer main.
concurrency:
  group: fly-deploy
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - name: Deploy to fly
        id: deployment
        # pipefail: a failed deploy must fail the job, not just print its last line
        run: |
          set -o pipefail
          flyctl deploy --remote-only | tail -n 1 >> $GITHUB_STEP_SUMMARY
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # The SAT Dojo worker (dojo/fly.toml), a separate app that only runs while evaluating
  deploy-dojo:
    name: Deploy dojo worker
    # After the site, see concurrency above
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - name: Deploy to fly
        run: |
          set -o pipefail
          flyctl deploy . --config dojo/fly.toml --dockerfile dojo/Dockerfile --remote-only --no-public-ips | tail -n 1 >> $GITHUB_STEP_SUMMARY
        env:
          # A deploy token for hashi-dojo only
          FLY_API_TOKEN: ${{ secrets.FLY_DOJO_API_TOKEN }}
