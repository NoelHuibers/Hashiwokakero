name: CI
on:
  pull_request:
  push:
    branches:
      - main

# One run per branch at a time. A new push to a pull request cancels its older run. On main a
# run waits for the previous one (deploys included), so an older commit never deploys after a
# newer one; a newer push replaces a waiting run, which is fine, it deploys a newer main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether a pull request changes more than docs. A docs-only one (*.md, *.pdf, LICENSE files)
  # skips the lints, tests and builds below. Skipped jobs count as passed checks, so the required
  # ones still report; filtering the whole workflow out (paths-ignore) would leave them pending.
  # Pushes to main always run everything, the deploys depend on it. When this job fails, the
  # jobs that wait for it are skipped too, and pass: the E2E job below fails then instead.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      reference: ${{ steps.diff.outputs.reference }}
    steps:
      # The merge commit of the pull request and its parents
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          # Whole paths, anywhere in the tree. Nothing the builds or tests read matches.
          DOCS: '([^/]+/)*([^/]+\.(md|pdf)|LICENSE)'
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Against the first parent, main's head: what merging the pull request changes
          files=$(git diff --no-renames --name-only HEAD^1 HEAD)
          printf '%s\n' "$files"
          # The reference solvers' sources or binaries: rebuild and compare them
          if printf '%s\n' "$files" | grep -q '^dojo/reference/'; then
            echo "reference=true" >> "$GITHUB_OUTPUT"
          fi
          # Code, unless every changed file is a doc (and some file changed at all)
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qvxE "$DOCS"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs changed, the lints, tests and builds are skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # The lints, and the doctests. Every other test runs once, in the coverage job below.
  test:
    name: Test & lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # No debug info in the doctests' build: a smaller cache and faster linking. Failed asserts
    # and panics still say where.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain from rust-toolchain.toml (stable + wasm32 target, rustfmt, clippy)
      - run: rustup toolchain install
      # Only main saves its cache, pull requests start from it. Caches of pull requests could only
      # be used by the same pull request and push main's out of the 10 GB limit.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Lints first, they fail fastest. The lint levels live in Cargo.toml ([workspace.lints]);
      # -D warnings makes every warning an error, in every crate, target and feature set.
      # --locked everywhere: CI builds and tests exactly the versions in Cargo.lock, a dependency
      # update only arrives through a change of it (Dependabot's pull requests).
      - name: Formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path dojo/starter/Cargo.toml --check
      - name: Clippy (library crates, dojo worker, tests)
        run: cargo clippy --locked -p common -p sat_solver -p backend -p dojo -p house --all-targets --features dojo/worker -- -D warnings
      - name: Clippy (website, server)
        run: cargo clippy --locked -p hashi --all-targets --no-default-features --features ssr -- -D warnings
      - name: Clippy (starter kit)
        run: cargo clippy --locked --manifest-path dojo/starter/Cargo.toml --target wasm32-wasip1 -- -D warnings
      # cargo-llvm-cov runs doctests only on nightly (--doctests), so they run here, without
      # coverage. The crates have none yet (their code blocks are `text`), this step keeps the
      # first one from going untested. Not the website: it only runs its library's unit tests.
      - name: Doctests
        run: cargo test --locked --doc -p common -p backend -p sat_solver -p dojo --features dojo/worker

  # The committed reference solvers (dojo/reference/*.wasm) must be exactly what their pinned
  # sources build: a pull request that changes anything there rebuilds them with the pinned
  # wasi-sdk and compares the bytes. Not a required check, it only runs for those.
  reference:
    name: Reference solvers
    needs: changes
    if: needs.changes.outputs.reference == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild and compare
        run: dojo/reference/build.sh --check

  # A job of its own, it runs next to the server lints instead of after them
  lint-browser:
    name: Lint (browser)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy (website, browser)
        run: cargo clippy --locked -p hashi --lib --no-default-features --features hydrate --target wasm32-unknown-unknown -- -D warnings

  # The unit, integration and HTTP tests (scripts/coverage.mjs), run once: instrumented for line
  # coverage, in debug, with the packages and features they always had. The script fails the job
  # when a test fails, or when coverage drops more than a percentage point below
  # scripts/coverage-baseline.json. The deploys wait for it.
  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # A stuck test shouldn't hold the job for the default six hours
    timeout-minutes: 30
    # No debug info: a smaller cache and faster linking. Coverage doesn't need it, the
    # instrumentation brings its own mapping to the source lines.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      # Only runs the script, no packages
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # drat-trim and cake_lpr, built like in the worker image: the Dojo's tests run the
      # leaderboard's proof checkers too, DOJO_REQUIRE_CHECKERS makes them fail without them
      - name: Proof checkers
        run: |
          dojo/checkers/build.sh "$HOME/checkers"
          {
            echo "DOJO_DRAT_TRIM=$HOME/checkers/drat-trim"
            echo "DOJO_CAKE_LPR=$HOME/checkers/cake_lpr"
            echo "DOJO_REQUIRE_CHECKERS=1"
          } >> "$GITHUB_ENV"
      # Writes the per-crate and per-file tables to the job summary
      - name: Tests with coverage
        run: node scripts/coverage.mjs
      # Also when the baseline check failed, the report shows which lines lost their tests
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            target/llvm-cov/html
            target/llvm-cov/lcov.info
          retention-days: 14

  # The release build, in two jobs side by side: the server here, the browser's WASM, JS and CSS
  # in the next. In one `cargo leptos build --release` they ran one after the other (with
  # hash-files cargo-leptos builds the server only after the site), 8 instead of about 5 minutes.
  # The server only reads the hashes of the site's file names at runtime, from hash.txt next to
  # its binary: the two halves are put together in dist/ by the jobs that use them.
  build:
    name: Build site
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Pinned: this server binary runs on Debian trixie (Dockerfile.prebuilt), it must not need a
    # newer glibc than trixie has
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-leptos
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y cargo-leptos@0.3.11
      - name: Build
        run: cargo leptos build --release --cargo-locked --server-only
      # The server binary, for the browser tests and the deploy below. A tarball keeps it
      # executable.
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/hashi dist/
          tar -cf server.tar dist
      - uses: actions/upload-artifact@v7
        with:
          name: site-server
          path: server.tar
          # Pull requests only need it for the browser tests right after
          retention-days: ${{ github.event_name == 'push' && 7 || 1 }}

  build-browser:
    name: Build site (browser)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # The pnpm version of packageManager in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # Its postinstall writes the fonts to public/fonts (scripts/fonts.mjs)
      - run: pnpm install --frozen-lockfile
      # The E2E job runs in the Playwright image of this version, see there
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-leptos
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y cargo-leptos@0.3.11
      - name: Build
        run: cargo leptos build --release --cargo-locked --frontend-only
      # The hashes of the JS/WASM/CSS file names (read next to the server binary) and the site
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/hash.txt dist/
          cp -r target/site dist/site
          tar -cf browser.tar dist
      - uses: actions/upload-artifact@v7
        with:
          name: site-browser
          path: browser.tar
          retention-days: ${{ github.event_name == 'push' && 7 || 1 }}

  # The browser tests (e2e/) on the release build above: every page in every language, the
  # journeys through the site, and the screenshots. Nothing deploys without them. Split in two
  # shards that run side by side (fullyParallel: by test, not by file, the screenshot tests
  # included); each starts its own servers on a freshly seeded database (e2e/global-setup.ts).
  e2e-shard:
    # GitHub adds the shard to the name, E2E shard (1) and (2); never just E2E, the required
    # check below
    name: E2E shard
    needs: [build, build-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # The other shard finishes, the report has every failure
      fail-fast: false
      matrix:
        shard: [1, 2]
    # The official image of the Playwright version in pnpm-lock.yaml, with its browsers and
    # fonts: the screenshots in e2e/tests/__screenshots__ are taken in it (pnpm run
    # e2e:update-snapshots), on another system they wouldn't match
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.build-browser.outputs.playwright }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # No fonts needed, the site in the artifact has them
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The server and the browser's half of the build, together in dist/
      - uses: actions/download-artifact@v8
        with:
          pattern: site-*
          merge-multiple: true
      - run: tar -xf server.tar && tar -xf browser.tar
      - name: Browser tests
        run: pnpm run e2e --shard=${{ matrix.shard }}/2
        env:
          E2E_BIN: dist/hashi
          E2E_SITE_ROOT: dist/site
          E2E_VISUAL: 1
          # A blob report instead of the HTML one, merged in the E2E report job
          E2E_BLOB: 1
      # Also when everything passed: a test that only passed on its retry is in it with a trace
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            e2e/blob-report
            e2e/.run/*.log
          include-hidden-files: true
          retention-days: 1

  # The required check: passes when both shards passed, or when they were skipped on purpose (a
  # docs-only pull request). always(): a failed shard must fail it, not skip it (a skipped
  # check counts as passed).
  e2e:
    name: E2E
    if: always()
    needs: [changes, e2e-shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "changes: $CHANGES, code changed: $CODE, shards: $SHARDS"
          if [ "$CHANGES" != success ]; then
            echo "::error::The changes job didn't succeed, the checks that wait for it were skipped"
            exit 1
          fi
          if [ "$CODE" = true ] && [ "$SHARDS" != success ]; then
            echo "::error::The E2E shards didn't pass ($SHARDS)"
            exit 1
          fi

  # One HTML report from the shards' blob reports, next to the servers' logs of each shard
  e2e-report:
    name: E2E report
    if: ${{ !cancelled() && needs.e2e-shard.result != 'skipped' }}
    needs: e2e-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-shard-*
          path: shards
      - name: Merge the reports
        run: |
          mkdir -p blobs e2e/.run
          for dir in shards/e2e-shard-*; do
            cp "$dir"/blob-report/*.zip blobs/
            if [ -d "$dir/.run" ]; then mv "$dir/.run" "e2e/.run/shard-${dir##*-}"; fi
          done
          pnpm exec playwright merge-reports --reporter html blobs
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          # The report has the traces and screenshots of the failed tests (with the differences
          # of the screenshots), .run/shard-* the servers' logs
          path: |
            e2e/playwright-report
            e2e/.run/*/*.log
          include-hidden-files: true
          retention-days: 7

  # The image the deploy ships, built from the same artifact and started: it has to serve the
  # site. Dependabot's updates of its base image are tested here, before they deploy.
  docker:
    name: Docker image
    needs: [build, build-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The server and the browser's half of the build, together in dist/
      - uses: actions/download-artifact@v8
        with:
          pattern: site-*
          merge-multiple: true
      - run: tar -xf server.tar && tar -xf browser.tar
      - run: scripts/docker-smoke.sh

  # Deploys ship the binaries built above in a slim image, built here and pushed to Fly. Fly's
  # remote builder compiled everything again from scratch, 15 to 50 minutes per deploy, and ran
  # out of memory or hit its deadline when the site and the worker built at the same time.
  deploy:
    name: Deploy site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint-browser, coverage, build, build-browser, e2e, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The server and the browser's half of the build, together in dist/
      - uses: actions/download-artifact@v8
        with:
          pattern: site-*
          merge-multiple: true
      - run: tar -xf server.tar && tar -xf browser.tar
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - name: Deploy to fly
        # pipefail: a failed deploy must fail the job, not just print its last line
        run: |
          set -o pipefail
          flyctl deploy --local-only --dockerfile Dockerfile.prebuilt | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # The SAT Dojo worker (dojo/fly.toml) for the deploy below, only built for it: next to the
  # checks, it is ready when they pass
  build-dojo:
    name: Build dojo worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Pinned: the worker runs on Debian trixie (dojo/Dockerfile.prebuilt), it must not need a
    # newer glibc than trixie has
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      # Runs on main only, so it always saves its cache
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          cargo build --locked --release -p dojo --features worker
          mkdir -p dist && cp target/release/dojo dist/
          tar -cf dojo.tar dist
      - uses: actions/upload-artifact@v7
        with:
          name: dojo
          path: dojo.tar
          retention-days: 7

  # The worker, a separate app that only runs while evaluating
  deploy-dojo:
    name: Deploy dojo worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint-browser, coverage, build, build-dojo]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dojo
      - run: tar -xf dojo.tar
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - name: Deploy to fly
        run: |
          set -o pipefail
          flyctl deploy . --config dojo/fly.toml --dockerfile dojo/Dockerfile.prebuilt --local-only --no-public-ips | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
        env:
          # A deploy token for hashi-dojo only
          FLY_API_TOKEN: ${{ secrets.FLY_DOJO_API_TOKEN }}

  # The house entries (the reference solvers and our own, see scripts/dojo-house.sh) on the
  # leaderboard, once both apps run the new code: unchanged ones are duplicates and stay, changed
  # ones replace their old version. Skipped until the HASHI_ADMIN_TOKEN secret (the site's admin
  # token) is set in the repository.
  house:
    name: Upload house entries
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy, deploy-dojo]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HASHI_ADMIN_TOKEN: ${{ secrets.HASHI_ADMIN_TOKEN }}
    steps:
      - if: env.HASHI_ADMIN_TOKEN == ''
        run: echo "No HASHI_ADMIN_TOKEN secret, the house entries aren't uploaded" >> "$GITHUB_STEP_SUMMARY"
      - if: env.HASHI_ADMIN_TOKEN != ''
        uses: actions/checkout@v7
      - if: env.HASHI_ADMIN_TOKEN != ''
        run: rustup toolchain install
      - if: env.HASHI_ADMIN_TOKEN != ''
        uses: Swatinem/rust-cache@v2
      - if: env.HASHI_ADMIN_TOKEN != ''
        name: Upload
        run: |
          set -o pipefail
          scripts/dojo-house.sh https://hashi.rs | tee -a "$GITHUB_STEP_SUMMARY"
