name: CI
on:
  pull_request:
  push:
    branches:
      - main

# One run per branch at a time. A new push to a pull request cancels its older run. On main a
# run waits for the previous one (deploys included), so an older commit never deploys after a
# newer one; a newer push replaces a waiting run, which is fine, it deploys a newer main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether a pull request changes more than docs. A docs-only one (*.md, *.pdf, LICENSE files)
  # skips the lints, tests and builds below. Skipped jobs count as passed checks, so the required
  # ones still report; filtering the whole workflow out (paths-ignore) would leave them pending.
  # Pushes to main always run everything, the deploys depend on it. When this job fails, the
  # jobs that wait for it are skipped too, and pass: the E2E job below fails then instead.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      reference: ${{ steps.diff.outputs.reference }}
    steps:
      # The merge commit of the pull request and its parents
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          # Whole paths, anywhere in the tree. Nothing the builds or tests read matches.
          DOCS: '([^/]+/)*([^/]+\.(md|pdf)|LICENSE)'
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Against the first parent, main's head: what merging the pull request changes
          files=$(git diff --no-renames --name-only HEAD^1 HEAD)
          printf '%s\n' "$files"
          # The reference solvers' sources or binaries: rebuild and compare them
          if printf '%s\n' "$files" | grep -q '^dojo/reference/'; then
            echo "reference=true" >> "$GITHUB_OUTPUT"
          fi
          # Code, unless every changed file is a doc (and some file changed at all)
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qvxE "$DOCS"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs changed, the lints, tests and builds are skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # The lints, and the doctests. Every other test runs once, in the coverage job below.
  test:
    name: Test & lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # No debug info in the doctests' build: a smaller cache and faster linking. Failed asserts
    # and panics still say where.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain from rust-toolchain.toml (stable + wasm32 target, rustfmt, clippy)
      - run: rustup toolchain install
      # Only main saves its cache, pull requests start from it. Caches of pull requests could only
      # be used by the same pull request and push main's out of the 10 GB limit.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Lints first, they fail fastest. The lint levels live in Cargo.toml ([workspace.lints]);
      # -D warnings makes every warning an error, in every crate, target and feature set.
      # --locked everywhere: CI builds and tests exactly the versions in Cargo.lock, a dependency
      # update only arrives through a change of it (Dependabot's pull requests).
      - name: Formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path dojo/starter/Cargo.toml --check
      - name: Packaged smoke harness regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_packaged_smoke.py' -v
      # The mobile app's version is the same in all its files (the runner's Node, no packages)
      - name: App version
        run: |
          node --test scripts/tests/app-version.test.mjs
          node scripts/app-version.mjs
      - name: Clippy (library crates, dojo worker, tests)
        run: cargo clippy --locked -p common -p sat_solver -p backend -p dojo -p house --all-targets --features dojo/worker -- -D warnings
      - name: Clippy (website, server)
        run: cargo clippy --locked -p hashi --all-targets --no-default-features --features ssr -- -D warnings
      - name: Clippy (starter kit)
        run: cargo clippy --locked --manifest-path dojo/starter/Cargo.toml --target wasm32-wasip1 -- -D warnings
      # cargo-llvm-cov runs doctests only on nightly (--doctests), so they run here, without
      # coverage. Keep the website's examples checked too; its coverage job runs unit tests.
      - name: Doctests
        run: cargo test --locked --doc -p common -p backend -p sat_solver -p dojo --features dojo/worker
      - name: Website doctests
        run: cargo test --locked --doc -p hashi --no-default-features --features ssr

  # The committed reference solvers (dojo/reference/*.wasm) must be exactly what their pinned
  # sources build: a pull request that changes anything there rebuilds them with the pinned
  # wasi-sdk and compares the bytes. Not a required check, it only runs for those.
  reference:
    name: Reference solvers
    needs: changes
    if: needs.changes.outputs.reference == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild and compare
        run: dojo/reference/build.sh --check

  # A job of its own, it runs next to the server lints instead of after them
  lint-browser:
    name: Lint (browser)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy (website, browser)
        run: cargo clippy --locked -p hashi --lib --no-default-features --features hydrate --target wasm32-unknown-unknown -- -D warnings
      # The client-side rendered build of the mobile app (docs/mobile.md)
      - name: Clippy (app, browser)
        run: cargo clippy --locked -p hashi --lib --no-default-features --features csr --target wasm32-unknown-unknown -- -D warnings

  # The unit, integration and HTTP tests (scripts/coverage.mjs), run once: instrumented for line
  # coverage, in debug, with the packages and features they always had. The script fails the job
  # when a test fails, or when coverage drops more than a percentage point below
  # scripts/coverage-baseline.json. The deploys wait for it.
  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # A stuck test shouldn't hold the job for the default six hours
    timeout-minutes: 30
    # No debug info: a smaller cache and faster linking. Coverage doesn't need it, the
    # instrumentation brings its own mapping to the source lines.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      # Only runs the script, no packages
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # drat-trim and cake_lpr, built like in the worker image: the Dojo's tests run the
      # leaderboard's proof checkers too; missing tools fail the tests
      - name: Proof checkers
        run: |
          dojo/checkers/build.sh "$HOME/checkers"
          {
            echo "DOJO_DRAT_TRIM=$HOME/checkers/drat-trim"
            echo "DOJO_CAKE_LPR=$HOME/checkers/cake_lpr"
          } >> "$GITHUB_ENV"
      # Writes the per-crate and per-file tables to the job summary
      - name: Tests with coverage
        run: node scripts/coverage.mjs
      # Also when the baseline check failed, the report shows which lines lost their tests
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            target/llvm-cov/html
            target/llvm-cov/lcov.info
          retention-days: 14

  # The release build, in two jobs side by side: the server here, the browser's WASM, JS and CSS
  # in the next. In one `cargo leptos build --release` they ran one after the other (with
  # hash-files cargo-leptos builds the server only after the site), 8 instead of about 5 minutes.
  # The server only reads the hashes of the site's file names at runtime, from hash.txt next to
  # its binary: the two halves are put together in dist/ by the jobs that use them.
  build:
    name: Build site
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Pinned: this server binary runs on Debian trixie (Dockerfile.prebuilt), it must not need a
    # newer glibc than trixie has
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-leptos
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y cargo-leptos@0.3.11
      - name: Build
        run: cargo leptos build --release --cargo-locked --server-only
      # The server binary, for the browser tests and the deploy below. A tarball keeps it
      # executable.
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/hashi dist/
          tar -cf server.tar dist
      - uses: actions/upload-artifact@v7
        with:
          name: site-server
          path: server.tar
          # Pull requests only need it for the browser tests right after
          retention-days: ${{ github.event_name == 'push' && 7 || 1 }}

  build-browser:
    name: Build site (browser)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # The pnpm version of packageManager in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # Its postinstall writes the fonts to public/fonts (scripts/fonts.mjs)
      - run: pnpm install --frozen-lockfile
      # The E2E job runs in the Playwright image of this version, see there
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-leptos
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y cargo-leptos@0.3.11
      - name: Build
        run: cargo leptos build --release --cargo-locked --frontend-only
      # The hashes of the JS/WASM/CSS file names (read next to the server binary) and the site
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/hash.txt dist/
          cp -r target/site dist/site
          tar -cf browser.tar dist
      - uses: actions/upload-artifact@v7
        with:
          name: site-browser
          path: browser.tar
          retention-days: ${{ github.event_name == 'push' && 7 || 1 }}

  # The browser tests (e2e/) on the release build above: every page in every language, the
  # journeys through the site, and the screenshots. Nothing deploys without them. Split in two
  # shards that run side by side (fullyParallel: by test, not by file, the screenshot tests
  # included); each starts its own servers on a freshly seeded database (e2e/global-setup.ts).
  e2e-shard:
    # GitHub adds the shard to the name, E2E shard (1) and (2); never just E2E, the required
    # check below
    name: E2E shard
    needs: [build, build-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # The other shard finishes, the report has every failure
      fail-fast: false
      matrix:
        shard: [1, 2]
    # The official image of the Playwright version in pnpm-lock.yaml, with its browsers and
    # fonts: the screenshots in e2e/tests/__screenshots__ are taken in it (pnpm run
    # e2e:update-snapshots), on another system they wouldn't match
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.build-browser.outputs.playwright }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # No fonts needed, the site in the artifact has them
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The server and the browser's half of the build, together in dist/
      - uses: actions/download-artifact@v8
        with:
          pattern: site-*
          merge-multiple: true
      - run: tar -xf server.tar && tar -xf browser.tar
      - name: Browser tests
        run: pnpm run e2e --shard=${{ matrix.shard }}/2
        env:
          E2E_BIN: dist/hashi
          E2E_SITE_ROOT: dist/site
          E2E_VISUAL: 1
          # A blob report instead of the HTML one, merged in the E2E report job
          E2E_BLOB: 1
      # Also when everything passed: a test that only passed on its retry is in it with a trace
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            e2e/blob-report
            e2e/.run/*.log
          include-hidden-files: true
          retention-days: 1

  # The required check: browser shards and the packaged site/worker must pass, or be skipped
  # on purpose for a docs-only pull request. always(): a failure must fail it, not skip it (a skipped
  # check counts as passed).
  e2e:
    name: E2E
    if: always()
    needs: [changes, e2e-shard, packaged]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          SHARDS: ${{ needs.e2e-shard.result }}
          PACKAGED: ${{ needs.packaged.result }}
        run: |
          echo "changes: $CHANGES, code changed: $CODE, shards: $SHARDS, packaged: $PACKAGED"
          if [ "$CHANGES" != success ]; then
            echo "::error::The changes job didn't succeed, the checks that wait for it were skipped"
            exit 1
          fi
          if [ "$CODE" = false ]; then
            exit 0
          fi
          if [ "$CODE" != true ]; then
            echo "::error::Missing or invalid code-change classification"
            exit 1
          fi
          if [ "$SHARDS" != success ] || [ "$PACKAGED" != success ]; then
            echo "::error::E2E prerequisites didn't pass (shards: $SHARDS, packaged: $PACKAGED)"
            exit 1
          fi

  # One HTML report from the shards' blob reports, next to the servers' logs of each shard
  e2e-report:
    name: E2E report
    if: ${{ !cancelled() && needs.e2e-shard.result != 'skipped' }}
    needs: e2e-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-shard-*
          path: shards
      - name: Merge the reports
        run: |
          mkdir -p blobs e2e/.run
          for dir in shards/e2e-shard-*; do
            cp "$dir"/blob-report/*.zip blobs/
            if [ -d "$dir/.run" ]; then mv "$dir/.run" "e2e/.run/shard-${dir##*-}"; fi
          done
          pnpm exec playwright merge-reports --reporter html blobs
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          # The report has the traces and screenshots of the failed tests (with the differences
          # of the screenshots), .run/shard-* the servers' logs
          path: |
            e2e/playwright-report
            e2e/.run/*/*.log
          include-hidden-files: true
          retention-days: 7

  # The mobile app's web bundle (app/, docs/mobile.md): the same UI rendered in the browser
  # alone, built by Trunk. Not a required check and not in Release compatibility, the app can't
  # hold up the website's deploy. The Android build takes the bundle from its artifact.
  build-app:
    name: Build app (web)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # The Tailwind CLI, and the fonts in public/fonts (postinstall, scripts/fonts.mjs)
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Pinned, like trunk-version in app/Trunk.toml. Trunk fetches the wasm-bindgen of
      # Cargo.lock and wasm-opt itself.
      - name: Install Trunk
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y trunk@0.22.0
      # hashi itself is linted with csr in "Lint (browser)"
      - name: Clippy
        run: cargo clippy --locked -p hashi_app --target wasm32-unknown-unknown -- -D warnings
      - name: Build
        run: pnpm run app:build --locked
      # What index.html loads, and the assets of public/; the sizes in the job summary
      - name: Check the bundle
        working-directory: target/app-dist
        run: |
          for file in hashi_app-*_bg.wasm hashi_app-*.js hashi-*.css fonts/fonts.css favicon.svg manifest.webmanifest; do
            test -f "$file" || { echo "::error::$file is missing from the bundle"; exit 1; }
            case "$file" in fonts/*|*.svg|*.webmanifest) ;; *) grep -qF "/$file" index.html || { echo "::error::index.html doesn't load $file"; exit 1; } ;; esac
          done
          ls fonts/*.woff2 > /dev/null
          node -e '
            const fs = require("fs"), zlib = require("zlib");
            const rows = fs.readdirSync(".").filter((f) => /\.(wasm|js|css)$/.test(f)).map((f) => {
              const data = fs.readFileSync(f);
              const kb = (n) => (n / 1024).toFixed(0) + " KB";
              return `| ${f} | ${kb(data.length)} | ${kb(zlib.gzipSync(data, { level: 9 }).length)} | ${kb(zlib.brotliCompressSync(data).length)} |`;
            });
            console.log(["| App bundle | raw | gzip | brotli |", "|---|---|---|---|", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
          # Left out by Trunk.toml, the app doesn't carry the Dojo's development set
          if ls dojo-dev-*.tar.gz > /dev/null 2>&1; then echo "::error::the Dojo's development set is in the bundle"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: app-web
          path: target/app-dist
          retention-days: ${{ github.event_name == 'push' && 7 || 1 }}

  # The bundle above in a browser (e2e/app/, its own Playwright config): it starts, renders
  # what the server functions return, routes and takes the language from the path. Served like
  # in the app, every path is index.html, with /api passed on to a server of the release build.
  app-e2e:
    name: Smoke test app (web)
    needs: [build, build-browser, build-app]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.build-browser.outputs.playwright }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The server (with the site it starts with) and the app's bundle
      - uses: actions/download-artifact@v8
        with:
          pattern: site-*
          merge-multiple: true
      - run: tar -xf server.tar && tar -xf browser.tar
      - uses: actions/download-artifact@v8
        with:
          name: app-web
          path: target/app-dist
      - name: Browser tests
        run: pnpm run app:e2e
        env:
          E2E_BIN: dist/hashi
          E2E_SITE_ROOT: dist/site
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-report
          path: |
            e2e/playwright-report-app
            e2e/.run/*.log
          include-hidden-files: true
          retention-days: ${{ github.event_name == 'push' && 7 || 1 }}

  # The Android app (app/src-tauri, docs/mobile.md): Tauri around the bundle of "Build app (web)",
  # taken from its artifact, as a debug APK for 64-bit ARM phones. Not a required check and not in
  # Release compatibility either: trouble with the Android toolchain can't hold up the website.
  android:
    name: Build app (Android)
    needs: [changes, build-app]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The runner's Android SDK has it preinstalled; pinned, as it links the Rust library
      NDK_VERSION: 29.0.14206865
      # No debug info in the debug build: a far smaller APK. Panics still say where.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      # Gradle (the Android Gradle plugin) needs a JDK 17 or newer
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Gradle's caches, written on main only like the Rust caches (basic: the open source cache)
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      # The Android target in this job only, not in rust-toolchain.toml (every job would get it)
      - run: rustup toolchain install && rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the Tauri CLI
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y tauri-cli@2.12.4
      # The web bundle, which Tauri puts into the app (frontendDist in tauri.conf.json)
      - uses: actions/download-artifact@v8
        with:
          name: app-web
          path: target/app-dist
      # The crates are outside the workspace, the lints of "Test & lint" don't see them
      - name: Formatting and Clippy
        working-directory: app/src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --target aarch64-linux-android -- -D warnings
          cargo clippy --locked -p hashi_offline --all-targets -- -D warnings
      # The offline practice (offline/, without Tauri): on the runner itself, which has none of
      # the system libraries Tauri needs on Linux
      - name: Test the offline practice
        working-directory: app/src-tauri
        run: cargo test --locked -p hashi_offline
      # Without beforeBuildCommand: the bundle is already there, from the artifact
      - name: Build
        working-directory: app/src-tauri
        run: cargo tauri android build --ci --debug --apk --target aarch64 --config '{"build":{"beforeBuildCommand":null}}'
      - name: Size
        working-directory: app/src-tauri
        run: |
          mb() { awk -v bytes="$(stat -L -c %s "$1")" 'BEGIN { printf "%.1f MB", bytes / 1048576 }'; }
          {
            echo "| Android (debug, arm64) | size |"
            echo "|---|---|"
            echo "| APK | $(mb gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk) |"
            # Stored uncompressed in the APK; the web bundle is in it, compressed by Tauri
            echo "| native library | $(mb target/aarch64-linux-android/debug/libhashi_tauri_lib.so) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: app/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          # Already compressed
          compression-level: 0
          retention-days: ${{ github.event_name == 'push' && 7 || 1 }}

  # The debug APK started on an Android emulator (e2e/android/, its own Playwright config): the
  # real WebView with the real content security policy and the offline practice's native
  # commands, driven through Playwright's Android support. Built here for x86_64, the emulator's
  # architecture, next to the arm64 build instead of after it: the emulator waits for no other
  # job. The device is offline the whole time and hashi.rs is blocked on the runner too: the debug
  # APK calls the production server, where the test must not make a guest. Not a required check
  # and not in Release compatibility, an emulator is flaky by nature.
  android-emulator:
    name: Android emulator smoke
    needs: [changes, build-app]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NDK_VERSION: 29.0.14206865
      CARGO_PROFILE_DEV_DEBUG: 0
      # Google APIs x86_64, the newest API level the emulator action tests itself on Linux
      # runners (targetSdk is 37)
      EMULATOR_API: 35
      EMULATOR_TARGET: google_apis
    steps:
      # When the job's parts started and ended, for the job summary
      - run: |
          echo "TIMES=$RUNNER_TEMP/android-times" >> "$GITHUB_ENV"
          echo "job $(date +%s)" >> "$RUNNER_TEMP/android-times"
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: rustup toolchain install && rustup target add x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the Tauri CLI
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y tauri-cli@2.12.4
      - uses: actions/download-artifact@v8
        with:
          name: app-web
          path: target/app-dist
      # As in "Build app (Android)", for the emulator's architecture
      - name: Build
        working-directory: app/src-tauri
        run: |
          echo "build $(date +%s)" >> "$TIMES"
          cargo tauri android build --ci --debug --apk --target x86_64 --config '{"build":{"beforeBuildCommand":null}}'
          echo "built $(date +%s)" >> "$TIMES"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # Playwright drives the WebView over adb, it needs no browser of its own
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Behind the device's airplane mode: the emulator's traffic leaves through the runner
      - name: Block hashi.rs
        run: |
          for ip in $(getent ahosts hashi.rs | awk '{ print $1 }' | sort -u); do
            case "$ip" in *:*) sudo ip6tables -I OUTPUT -d "$ip" -j REJECT ;; *) sudo iptables -I OUTPUT -d "$ip" -j REJECT ;; esac
          done
          if curl -sS --max-time 10 -o /dev/null https://hashi.rs/; then echo "::error::hashi.rs is still reachable"; exit 1; fi
      # As GitHub documents it for the emulator
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # What the emulator action installs, beforehand with retries: a download of the emulator
      # failed once ("Error on ZipFile unknown archive"), the action would give up
      - name: Emulator and system image
        run: |
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator "platforms;android-$EMULATOR_API" \
              "system-images;android-$EMULATOR_API;$EMULATOR_TARGET;x86_64" > /dev/null && exit 0
            sleep 10
          done
          exit 1
      # A cold boot every time, about 35 s. A cached snapshot of the booted emulator (the action's
      # README) was 2 GB: restoring it took longer than the boot it saved, and the caches are full.
      # Every line of the script runs alone (sh -c), a failing one ends it: the tests' result is
      # kept for the last line, after the logcat.
      - name: Tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            echo "booted $(date +%s)" >> "$TIMES"
            adb logcat -c
            pnpm run app:android-e2e || echo failed > "$RUNNER_TEMP/android-failed"
            echo "tested $(date +%s)" >> "$TIMES"
            adb logcat -d -v threadtime > "$RUNNER_TEMP/logcat-all.txt"
            grep -E 'rs\.hashi|Tauri|[Ww]ry|RustStdoutStderr|chromium|cr_|WebView|Console|AndroidRuntime|DEBUG|libc|ActivityManager' "$RUNNER_TEMP/logcat-all.txt" > e2e/test-results-android-logcat.txt || true
            test ! -f "$RUNNER_TEMP/android-failed"
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          echo "done $(date +%s)" >> "$TIMES"
          node -e '
            const fs = require("fs");
            const times = Object.fromEntries(fs.readFileSync(process.env.TIMES, "utf8").trim().split("\n").map((l) => l.split(" ")));
            const span = (a, b) => (times[a] && times[b] ? `${Math.round((times[b] - times[a]) / 60 * 10) / 10} min` : "–");
            const read = (f) => (fs.existsSync(f) ? JSON.parse(fs.readFileSync(f, "utf8")) : null);
            const device = read("e2e/test-results-android-device.json");
            const report = read("e2e/test-results-android.json");
            const rows = [
              "| Android emulator | |", "|---|---|",
              `| image | API ${process.env.EMULATOR_API}, ${process.env.EMULATOR_TARGET}, x86_64 |`,
              `| device | ${device ? `${device.model}, Android ${device.android}, WebView ${device.webView}` : "–"} |`,
              `| job | ${span("job", "done")} |`,
              `| x86_64 APK build | ${span("build", "built")} |`,
              `| emulator (SDK, cold boot) | ${span("built", "booted")} |`,
              `| tests | ${span("booted", "tested")} |`,
            ];
            if (report) {
              const s = report.stats;
              rows.push(`| passed | ${s.expected} |`, `| failed | ${s.unexpected} |`, `| flaky (passed on the retry) | ${s.flaky} |`, `| skipped | ${s.skipped} |`);
              const walk = (suite) => [...(suite.specs ?? []), ...(suite.suites ?? []).flatMap(walk)];
              for (const spec of report.suites.flatMap(walk)) {
                for (const result of spec.tests.flatMap((t) => t.results)) {
                  for (const a of result.annotations ?? []) {
                    const note = a.type === "launch" ? `launch ${a.description}` : `${a.type}: ${a.description}`;
                    rows.push(`| ${spec.title} | ${note} |`);
                  }
                }
              }
            }
            console.log(rows.join("\n"));
          ' | tee -a "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-screenshot
          path: e2e/android-screens
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'push' && 7 || 1 }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-report
          path: |
            e2e/playwright-report-android
            e2e/test-results-android-logcat.txt
          retention-days: ${{ github.event_name == 'push' && 7 || 1 }}

  # The image the deploy ships, built from the same artifact and started: it has to serve the
  # site. Dependabot's updates of its base image are tested here, before they deploy.
  docker:
    name: Docker image
    needs: [build, build-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The server and the browser's half of the build, together in dist/
      - uses: actions/download-artifact@v8
        with:
          pattern: site-*
          merge-multiple: true
      - run: tar -xf server.tar && tar -xf browser.tar
      - run: scripts/docker-smoke.sh

  # Same prebuilt Dockerfiles/binaries as deployment, with the production proof checkers.
  # No deployment credentials, generated hidden set, or built-in checker fallback.
  packaged:
    name: Packaged site + worker
    needs: [build, build-browser, build-dojo]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: site-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: dojo
      - run: tar -xf server.tar && tar -xf browser.tar && tar -xf dojo.tar
      - name: Build production runtime images
        run: |
          mkdir -p packaged-logs
          set -o pipefail
          timeout 300 docker build --file Dockerfile.prebuilt --tag hashi-packaged-site . 2>&1 | tee packaged-logs/site-build.log
          timeout 420 docker build --file dojo/Dockerfile.prebuilt --tag hashi-packaged-worker . 2>&1 | tee packaged-logs/worker-build.log
      - name: Verified SAT/UNSAT and authenticated dispatch/callback
        run: python3 scripts/packaged-smoke.py --site-image hashi-packaged-site --worker-image hashi-packaged-worker --logs packaged-logs/smoke
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-compatibility
          path: packaged-logs
          retention-days: 7

  # A shared, fail-closed release prerequisite. The six required names remain; E2E also
  # requires the packaged smoke, so current branch protection enforces that result.
  # always() makes failed/cancelled/skipped prerequisites red, except intentional docs-only PRs.
  compatibility:
    name: Release compatibility
    if: always()
    needs: [changes, test, lint-browser, coverage, build, build-browser, build-dojo, e2e, docker, packaged]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "$CHANGES" != success ]; then
            echo "::error::Change detection failed ($CHANGES)"
            exit 1
          fi
          if [ "$CODE" = false ]; then
            echo "Docs-only PR: compatibility checks intentionally skipped"
            exit 0
          fi
          if [ "$CODE" != true ]; then
            echo "::error::Missing or invalid code-change classification"
            exit 1
          fi
          read -r -a results <<< "$RESULTS"
          if [ "${#results[@]}" -ne 10 ]; then
            echo "::error::Expected all 10 prerequisite results, got: $RESULTS"
            exit 1
          fi
          for result in "${results[@]}"; do
            if [ "$result" != success ]; then
              echo "::error::Release compatibility prerequisite did not pass: $RESULTS"
              exit 1
            fi
          done

  # Deploys ship the binaries built above in a slim image, built here and pushed to Fly. Fly's
  # remote builder compiled everything again from scratch, 15 to 50 minutes per deploy, and ran
  # out of memory or hit its deadline when the site and the worker built at the same time.
  deploy:
    name: Deploy site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [compatibility, build, build-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The server and the browser's half of the build, together in dist/
      - uses: actions/download-artifact@v8
        with:
          pattern: site-*
          merge-multiple: true
      - run: tar -xf server.tar && tar -xf browser.tar
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - name: Deploy to fly
        # pipefail: a failed deploy must fail the job, not just print its last line
        run: |
          set -o pipefail
          flyctl deploy --local-only --dockerfile Dockerfile.prebuilt | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Build on code PRs too: the packaged compatibility gate tests the exact worker artifact.
  build-dojo:
    name: Build dojo worker
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Pinned: the worker runs on Debian trixie (dojo/Dockerfile.prebuilt), it must not need a
    # newer glibc than trixie has
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: |
          cargo build --locked --release -p dojo --features worker
          mkdir -p dist && cp target/release/dojo dist/
          tar -cf dojo.tar dist
      - uses: actions/upload-artifact@v7
        with:
          name: dojo
          path: dojo.tar
          retention-days: ${{ github.event_name == 'push' && 7 || 1 }}

  # The worker, a separate app that only runs while evaluating
  deploy-dojo:
    name: Deploy dojo worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [compatibility, build-dojo]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dojo
      - run: tar -xf dojo.tar
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - name: Deploy to fly
        run: |
          set -o pipefail
          flyctl deploy . --config dojo/fly.toml --dockerfile dojo/Dockerfile.prebuilt --local-only --no-public-ips | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
        env:
          # A deploy token for hashi-dojo only
          FLY_API_TOKEN: ${{ secrets.FLY_DOJO_API_TOKEN }}

  # The house entries (the reference solvers and our own, see scripts/dojo-house.sh) on the
  # leaderboard, once both apps run the new code: unchanged ones are duplicates and stay, changed
  # ones replace their old version. Skipped until the HASHI_ADMIN_TOKEN secret (the site's admin
  # token) is set in the repository.
  house:
    name: Upload house entries
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy, deploy-dojo]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HASHI_ADMIN_TOKEN: ${{ secrets.HASHI_ADMIN_TOKEN }}
    steps:
      - if: env.HASHI_ADMIN_TOKEN == ''
        run: echo "No HASHI_ADMIN_TOKEN secret, the house entries aren't uploaded" >> "$GITHUB_STEP_SUMMARY"
      - if: env.HASHI_ADMIN_TOKEN != ''
        uses: actions/checkout@v7
      - if: env.HASHI_ADMIN_TOKEN != ''
        run: rustup toolchain install
      - if: env.HASHI_ADMIN_TOKEN != ''
        uses: Swatinem/rust-cache@v2
      - if: env.HASHI_ADMIN_TOKEN != ''
        name: Upload
        run: |
          set -o pipefail
          scripts/dojo-house.sh https://hashi.rs | tee -a "$GITHUB_STEP_SUMMARY"
