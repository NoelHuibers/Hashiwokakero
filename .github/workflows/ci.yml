name: CI
on:
  pull_request:
  push:
    branches:
      - main

# One run per branch at a time. A new push to a pull request cancels its older run. On main a
# run waits for the previous one (deploys included), so an older commit never deploys after a
# newer one; a newer push replaces a waiting run, which is fine, it deploys a newer main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint
    # Pinned: the dojo binary built here runs on Debian trixie (dojo/Dockerfile.prebuilt), it
    # must not need a newer glibc than trixie has
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain from rust-toolchain.toml (stable + wasm32 target, rustfmt, clippy)
      - run: rustup toolchain install
      # Only main saves its cache, pull requests start from it. Caches of pull requests could only
      # be used by the same pull request and push main's out of the 10 GB limit.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Lints first, they fail fastest. The lint levels live in Cargo.toml ([workspace.lints]);
      # -D warnings makes every warning an error, in every crate, target and feature set.
      # --locked everywhere: CI builds and tests exactly the versions in Cargo.lock, a dependency
      # update only arrives through a change of it (Dependabot's pull requests).
      - name: Formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path dojo/starter/Cargo.toml --check
      - name: Clippy (library crates, dojo worker, tests)
        run: cargo clippy --locked -p common -p sat_solver -p backend -p dojo -p house --all-targets --features dojo/worker -- -D warnings
      - name: Clippy (website, server)
        run: cargo clippy --locked -p hashi --all-targets --no-default-features --features ssr -- -D warnings
      - name: Clippy (starter kit)
        run: cargo clippy --locked --manifest-path dojo/starter/Cargo.toml --target wasm32-wasip1 -- -D warnings
      - name: Test backend crates
        run: cargo test --locked -p common -p backend -p sat_solver
      - name: Test the SAT Dojo (sandbox, scoring, worker)
        run: cargo test --locked --release -p dojo --features worker
      # Also drives the real router over HTTP (src/server/router/tests): server functions,
      # cookies, the Dojo and admin routes, caching and compression
      - name: Test the website's server code and HTTP routes
        run: cargo test --locked --no-default-features --features ssr -p hashi --lib
      # The worker for the deploy below, nearly free here: the release tests above compiled
      # all of its dependencies already
      - name: Build the dojo worker
        if: github.event_name == 'push'
        run: |
          cargo build --locked --release -p dojo --features worker
          mkdir -p dist && cp target/release/dojo dist/
          tar -cf dojo.tar dist
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: dojo
          path: dojo.tar
          retention-days: 7

  # A job of its own, it runs next to the server lints instead of after them
  lint-browser:
    name: Lint (browser)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy (website, browser)
        run: cargo clippy --locked -p hashi --lib --no-default-features --features hydrate --target wasm32-unknown-unknown -- -D warnings

  # Line coverage of the tests the test job runs, in a job of its own: the instrumented build
  # runs next to the other jobs instead of after them, and the plain tests stay as fast as they
  # were. scripts/coverage.mjs fails it when coverage drops more than a percentage point below
  # scripts/coverage-baseline.json.
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    # A stuck test shouldn't hold the job for the default six hours
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      # Only runs the script, no packages
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # Writes the per-crate and per-file tables to the job summary
      - name: Tests with coverage
        run: node scripts/coverage.mjs
      # Also when the baseline check failed, the report shows which lines lost their tests
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            target/llvm-cov/html
            target/llvm-cov/lcov.info
          retention-days: 14

  build:
    name: Build site
    # Pinned, see the test job: this server binary runs on Debian trixie (Dockerfile.prebuilt)
    runs-on: ubuntu-24.04
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      # The E2E job runs in the Playwright image of this version, see there
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm run fonts
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-leptos
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y cargo-leptos@0.3.11
      - name: Build
        run: cargo leptos build --release --cargo-locked
      # The server binary, the hashes of the JS/WASM/CSS file names (read next to the binary) and
      # the site, for the browser tests and the deploy below. A tarball keeps the binary
      # executable.
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/hashi target/release/hash.txt dist/
          cp -r target/site dist/site
          tar -cf site.tar dist
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site.tar
          # Pull requests only need it for the browser tests right after
          retention-days: ${{ github.event_name == 'push' && 7 || 1 }}

  # The browser tests (e2e/) on the release build above: every page in every language, the
  # journeys through the site, and the screenshots. Nothing deploys without them.
  e2e:
    name: E2E
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The official image of the Playwright version in package-lock.json, with its browsers and
    # fonts: the screenshots in e2e/tests/__screenshots__ are taken in it (npm run
    # e2e:update-snapshots), on another system they wouldn't match
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.build.outputs.playwright }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: site
      - run: tar -xf site.tar
      - name: Browser tests
        run: npm run e2e
        env:
          E2E_BIN: dist/hashi
          E2E_SITE_ROOT: dist/site
          E2E_VISUAL: 1
      # Also when everything passed: a test that only passed on its retry is in it with a trace
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          # The report has the traces and screenshots of the failed tests (with the differences
          # of the screenshots), .run the servers' logs
          path: |
            e2e/playwright-report
            e2e/.run/*.log
          include-hidden-files: true
          retention-days: 7

  # The image the deploy ships, built from the same artifact and started: it has to serve the
  # site. Dependabot's updates of its base image are tested here, before they deploy.
  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
      - run: tar -xf site.tar
      - run: scripts/docker-smoke.sh

  # Deploys ship the binaries built above in a slim image, built here and pushed to Fly. Fly's
  # remote builder compiled everything again from scratch, 15 to 50 minutes per deploy, and ran
  # out of memory or hit its deadline when the site and the worker built at the same time.
  deploy:
    name: Deploy site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint-browser, build, e2e, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
      - run: tar -xf site.tar
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - name: Deploy to fly
        # pipefail: a failed deploy must fail the job, not just print its last line
        run: |
          set -o pipefail
          flyctl deploy --local-only --dockerfile Dockerfile.prebuilt | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # The SAT Dojo worker (dojo/fly.toml), a separate app that only runs while evaluating
  deploy-dojo:
    name: Deploy dojo worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint-browser, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dojo
      - run: tar -xf dojo.tar
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - name: Deploy to fly
        run: |
          set -o pipefail
          flyctl deploy . --config dojo/fly.toml --dockerfile dojo/Dockerfile.prebuilt --local-only --no-public-ips | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
        env:
          # A deploy token for hashi-dojo only
          FLY_API_TOKEN: ${{ secrets.FLY_DOJO_API_TOKEN }}
