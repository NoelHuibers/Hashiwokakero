name: App release
# The mobile app's release (app/README.md, Releases): a tag app-v<x.y.z> on main, whose version
# all files agree on (scripts/app-version.ts), builds both platforms from the same commit:
# - Android: the App Bundle for Google Play, signed with the upload key and uploaded to Play's
#   internal test track.
# - Android, foss: the build without any proprietary code (no Play Games), an APK per ABI signed
#   with the direct key, published in our F-Droid repository on GitHub Pages
#   (https://noelhuibers.github.io/Hashiwokakero/), and uploaded to the Samsung Galaxy Store, the
#   Amazon Appstore and Huawei AppGallery as updates submitted for review.
# - iOS: the IPA for the App Store, signed by Xcode with the App Store Connect API key (automatic
#   signing, cloud-managed certificate) and uploaded to App Store Connect, where it shows up in
#   TestFlight once Apple has processed it.
# - Desktop (docs/stores.md, Desktop builds): installers for Windows (x64 and arm64), macOS
#   (universal) and Linux (x64 and arm64), the sources of the desktop stores. macOS signed with
#   the Developer ID and notarized once its certificate is in the secrets, Windows unsigned.
# - Microsoft Store (docs/stores.md, Microsoft Store): the Windows builds as an MSIX bundle (x64
#   and arm64, unsigned: the Store signs it), uploaded as the app's next submission and committed
#   for certification.
# - Snap Store (docs/stores.md, Snap Store): the Linux .deb of each architecture (amd64, arm64)
#   as a snap (app/linux/snap/snapcraft.yaml), uploaded into a channel (stable by default).
# A GitHub release for the tag gets the bundle, a universal APK, the foss APKs, the IPA, the
# desktop installers, the MSIX bundle and the snaps.
#
# A pull request that changes this workflow or the version script runs it as a dry run for all
# platforms, below; one that changes the Gradle build, the Play or foss sources, the F-Droid
# repository's files or app/achievements-play.json (Play Games' project id) for Android, one that
# changes the iOS project (gen/apple, Info.ios.plist) for iOS, one that changes tauri.conf.json
# (the version, the bundles' settings) or the icons for the desktop.
#
# By hand (Actions, Run workflow, or `gh workflow run app-release.yml --ref <ref>`):
# - publish off (the default): a dry run on any branch or tag. Builds, signs and checks the bundle
#   and the IPA and keeps them as artifacts; no upload to Play or App Store Connect, no GitHub
#   release. On a branch it skips the checks of the tag, of main and of CI.
# - publish on: the same as pushing the tag, the ref has to be one (`--ref app-v1.2.3`). For an
#   upload that failed or was skipped, e.g. before the PLAY_SERVICE_ACCOUNT_JSON secret was set.
# - fdroid on: builds nothing, publishes the F-Droid repository again from the foss APKs of the
#   GitHub releases, with the store texts and images of the ref (main), e.g. after new listings.
# - galaxy on: builds nothing, uploads the foss APKs of the tag's GitHub release to the Galaxy
#   Store (`--ref app-v1.2.3`), e.g. once its secrets are set or after a review held it up.
# - amazon on: the same for the Amazon Appstore, huawei on: for Huawei AppGallery (together are
#   fine).
# - msstore on: builds nothing, uploads the MSIX bundle of the tag's GitHub release to the
#   Microsoft Store (`--ref app-v1.2.3`; with the Android stores is fine too).
# - snap on: the same with the snaps of the tag's GitHub release, to the Snap Store.
# - desktop on: builds only the desktop installers, the MSIX bundle and the snaps of the tag
#   (`--ref app-v1.2.3`) and puts them on its GitHub release, replacing those it has, e.g. signed
#   ones once the Developer ID certificate is in the secrets, or the bundle once the Store's
#   identity is in the variables.
#
# iOS needs the secrets APPLE_API_KEY_ID, APPLE_API_ISSUER and APPLE_API_KEY_P8. Without them
# (pull requests of Dependabot or forks) it is skipped with a notice; Android goes on. The foss
# build needs the direct key (ANDROID_DIRECT_*) and the F-Droid repository its index key
# (FDROID_*): without them a release skips them with a notice, a dry run signs with throwaway keys.
# The Galaxy Store needs its service account (SAMSUNG_*, docs/stores.md), the Amazon Appstore its
# security profile (AMAZON_*), AppGallery its Service Account (HUAWEI_SERVICE_ACCOUNT_JSON): without
# them their upload is skipped with a notice; so is the Microsoft Store's without its Entra
# application (MS_STORE_TENANT_ID, MS_STORE_CLIENT_ID, MS_STORE_CLIENT_SECRET, and the variable
# MS_STORE_APP_ID); its package needs the Store's identity (the variables MS_STORE_IDENTITY_NAME,
# MS_STORE_PUBLISHER), else it is built with a placeholder for the checks and not released. The
# Snap Store's upload needs snapcraft's login (SNAPCRAFT_STORE_CREDENTIALS), else it is skipped
# with a notice. The macOS build is signed with the Developer ID
# certificate (APPLE_DEVELOPER_ID_CERT_BASE64, APPLE_DEVELOPER_ID_CERT_PASSWORD) and notarized
# with the App Store Connect API key: without the certificate it is built signed ad hoc, with a
# notice.
on:
  push:
    tags:
      - app-v*
  pull_request:
    paths:
      - .github/workflows/app-release.yml
      - scripts/app-version.ts
      - app/src-tauri/gen/android/app/build.gradle.kts
      - app/src-tauri/gen/android/app/src/play/**
      - app/src-tauri/gen/android/app/src/foss/**
      - app/fdroid/**
      - scripts/fdroid-repo.ts
      - scripts/foss-apk.ts
      - scripts/galaxy-store.ts
      - scripts/amazon-appstore.ts
      - scripts/huawei-appgallery.ts
      # The MSIX package and the Microsoft Store's upload (the desktop's Windows builds)
      - scripts/microsoft-store.ts
      # The snaps and the Linux MetaInfo, and the Snap Store's upload
      - scripts/snap-store.ts
      - app/linux/**
      # Play Games' project id (and ids) for the release's App Bundle
      - app/achievements-play.json
      - app/src-tauri/gen/apple/**
      - app/src-tauri/Info.ios.plist
      # The desktop installers: their settings, the version and the icons
      - app/src-tauri/tauri.conf.json
      - app/src-tauri/icons/**
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to Google Play and App Store Connect, make the GitHub release and publish the F-Droid repository (the ref must be a tag app-v<x.y.z>)
        type: boolean
        default: false
      fdroid:
        description: Only publish the F-Droid repository again, from the GitHub releases' foss APKs and this ref's store texts (builds nothing)
        type: boolean
        default: false
      galaxy:
        description: Only upload the foss APKs of this tag's GitHub release to the Galaxy Store again (builds nothing; the ref must be a tag app-v<x.y.z>)
        type: boolean
        default: false
      amazon:
        description: Only upload the foss APKs of this tag's GitHub release to the Amazon Appstore again (builds nothing; the ref must be a tag app-v<x.y.z>)
        type: boolean
        default: false
      huawei:
        description: Only upload the foss APKs of this tag's GitHub release to Huawei AppGallery again (builds nothing; the ref must be a tag app-v<x.y.z>)
        type: boolean
        default: false
      msstore:
        description: Only upload the MSIX bundle of this tag's GitHub release to the Microsoft Store again (builds nothing; the ref must be a tag app-v<x.y.z>)
        type: boolean
        default: false
      snap:
        description: Only upload the snaps of this tag's GitHub release to the Snap Store again (builds nothing; the ref must be a tag app-v<x.y.z>)
        type: boolean
        default: false
      desktop:
        description: Only build the desktop installers, the MSIX bundle and the snaps and put them on this tag's GitHub release, replacing its ones (the ref must be a tag app-v<x.y.z>)
        type: boolean
        default: false

# One run per tag (or branch) at a time; a second one waits, it doesn't cancel an upload. A new
# push to a pull request cancels its older dry run.
concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # What this run is, and whether it may publish: the tag is app-v<the version of every file>, its
  # commit is on main and CI passed for it there. And which platforms it builds.
  check:
    name: Check the release
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      # The CI runs of the commit
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
      publish: ${{ steps.mode.outputs.publish }}
      # Only the F-Droid repository, from the GitHub releases
      fdroid: ${{ steps.mode.outputs.fdroid }}
      # Only the Galaxy Store, the Amazon Appstore and/or AppGallery, from the tag's GitHub release
      galaxy: ${{ steps.mode.outputs.galaxy }}
      amazon: ${{ steps.mode.outputs.amazon }}
      huawei: ${{ steps.mode.outputs.huawei }}
      # Only the Microsoft Store, from the tag's GitHub release
      msstore: ${{ steps.mode.outputs.msstore }}
      # Only the Snap Store, from the tag's GitHub release
      snap: ${{ steps.mode.outputs.snap }}
      # Only the desktop installers, onto the tag's GitHub release
      desktop_only: ${{ steps.mode.outputs.desktop_only }}
      android: ${{ steps.platforms.outputs.android }}
      ios: ${{ steps.platforms.outputs.ios }}
      desktop: ${{ steps.platforms.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request's merge commit and its parents, for the platforms below
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # Node 26 runs scripts/app-version.ts below (the runner's own Node may not strip types)
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
          FDROID: ${{ inputs.fdroid }}
          GALAXY: ${{ inputs.galaxy }}
          AMAZON: ${{ inputs.amazon }}
          HUAWEI: ${{ inputs.huawei }}
          MSSTORE: ${{ inputs.msstore }}
          SNAP: ${{ inputs.snap }}
          DESKTOP: ${{ inputs.desktop }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$DESKTOP" = true ]; then
            if [ "$PUBLISH" = true ] || [ "$FDROID" = true ] || [ "$GALAXY" = true ] || [ "$AMAZON" = true ] || [ "$HUAWEI" = true ] || [ "$MSSTORE" = true ] || [ "$SNAP" = true ]; then
              echo "::error::desktop together with another input: a release builds the desktop installers anyway, desktop is a run of its own"
              exit 1
            fi
            if [ "$REF_TYPE" != tag ]; then
              echo "::error::desktop puts the installers on a tag's GitHub release, not on the $REF_TYPE $REF_NAME (run it with --ref app-v<x.y.z>)"
              exit 1
            fi
            printf '%s\n' publish=false fdroid=false galaxy=false amazon=false huawei=false msstore=false snap=false desktop_only=true >> "$GITHUB_OUTPUT"
            echo "The desktop installers, the MSIX bundle and the snaps of $REF_NAME, onto its GitHub release" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "desktop_only=false" >> "$GITHUB_OUTPUT"
          stores=()
          if [ "$GALAXY" = true ]; then stores+=("the Galaxy Store"); fi
          if [ "$AMAZON" = true ]; then stores+=("the Amazon Appstore"); fi
          if [ "$HUAWEI" = true ]; then stores+=("Huawei AppGallery"); fi
          if [ "$MSSTORE" = true ]; then stores+=("the Microsoft Store"); fi
          if [ "$SNAP" = true ]; then stores+=("the Snap Store"); fi
          if [ ${#stores[@]} -gt 0 ]; then
            if [ "$PUBLISH" = true ] || [ "$FDROID" = true ]; then
              echo "::error::galaxy, amazon, huawei, msstore or snap together with publish or fdroid: a release uploads to the stores anyway, fdroid is a run of its own"
              exit 1
            fi
            if [ "$REF_TYPE" != tag ]; then
              echo "::error::galaxy, amazon, huawei, msstore and snap upload the files of a tag's GitHub release, not of the $REF_TYPE $REF_NAME (run it with --ref app-v<x.y.z>)"
              exit 1
            fi
            printf '%s\n' publish=false fdroid=false "galaxy=${GALAXY:-false}" "amazon=${AMAZON:-false}" "huawei=${HUAWEI:-false}" "msstore=${MSSTORE:-false}" "snap=${SNAP:-false}" >> "$GITHUB_OUTPUT"
            list=$(printf '%s, ' "${stores[@]}")
            echo "Again to ${list%, }, from the files of the GitHub release $REF_NAME" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s\n' galaxy=false amazon=false huawei=false msstore=false snap=false >> "$GITHUB_OUTPUT"
          if [ "$FDROID" = true ]; then
            if [ "$PUBLISH" = true ]; then
              echo "::error::publish and fdroid together: a release publishes the F-Droid repository anyway"
              exit 1
            fi
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "fdroid=true" >> "$GITHUB_OUTPUT"
            echo "The F-Droid repository again, from the GitHub releases and the store texts of the $REF_TYPE $REF_NAME" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "fdroid=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = push ] || [ "$PUBLISH" = true ]; then
            if [ "$REF_TYPE" != tag ]; then
              echo "::error::Publishing needs a tag app-v<x.y.z>, not the $REF_TYPE $REF_NAME (run it with --ref app-v<x.y.z>)"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Release of $REF_NAME: Google Play (internal track), App Store Connect (TestFlight), a GitHub release with the desktop installers, the F-Droid repository, the Galaxy Store, the Amazon Appstore, Huawei AppGallery, the Microsoft Store and the Snap Store" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Dry run on the $REF_TYPE $REF_NAME: built, signed and checked, not published" >> "$GITHUB_STEP_SUMMARY"
          fi
      # All, except on a pull request: the platforms whose files it changes. iOS only with the App
      # Store Connect API key, which pull requests of Dependabot and of forks don't get.
      - id: platforms
        env:
          EVENT: ${{ github.event_name }}
          DESKTOP_ONLY: ${{ steps.mode.outputs.desktop_only }}
          FDROID: ${{ steps.mode.outputs.fdroid }}
          GALAXY: ${{ steps.mode.outputs.galaxy }}
          AMAZON: ${{ steps.mode.outputs.amazon }}
          HUAWEI: ${{ steps.mode.outputs.huawei }}
          MSSTORE: ${{ steps.mode.outputs.msstore }}
          SNAP: ${{ steps.mode.outputs.snap }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          android=true ios=true desktop=true
          if [ "$FDROID" = true ] || [ "$GALAXY" = true ] || [ "$AMAZON" = true ] || [ "$HUAWEI" = true ] || [ "$MSSTORE" = true ] || [ "$SNAP" = true ]; then
            android=false ios=false desktop=false
          elif [ "$DESKTOP_ONLY" = true ]; then
            android=false ios=false
          elif [ "$EVENT" = pull_request ]; then
            # Against the first parent, main's head: what merging the pull request changes
            files=$(git diff --no-renames --name-only HEAD^1 HEAD)
            both='^(\.github/workflows/app-release\.yml|scripts/app-version\.ts)$'
            android_files='^app/src-tauri/gen/android/app/(build\.gradle\.kts$|src/(play|foss)/)|^app/achievements-play\.json$|^app/fdroid/|^scripts/(fdroid-repo|foss-apk|galaxy-store|amazon-appstore|huawei-appgallery)\.ts$'
            grep -qE "$both|$android_files" <<< "$files" || android=false
            grep -qE "$both|^app/src-tauri/gen/apple/|^app/src-tauri/Info\.ios\.plist$" <<< "$files" || ios=false
            grep -qE "$both|^app/src-tauri/(tauri\.conf\.json$|icons/)|^app/linux/|^scripts/(microsoft-store|snap-store)\.ts$" <<< "$files" || desktop=false
          fi
          if [ "$ios" = true ] && { [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY_P8" ]; }; then
            ios=false
            echo "::notice::No App Store Connect API key in this run's secrets (APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_API_KEY_P8), the iOS app isn't built"
            echo "No App Store Connect API key in this run's secrets, the iOS app isn't built (for a tag: once the secrets are set, run this workflow on it with publish)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Platforms: Android $android, iOS $ios, desktop $desktop"
          printf '%s\n' "android=$android" "ios=$ios" "desktop=$desktop" >> "$GITHUB_OUTPUT"
      # Fails when the files disagree; prints the version
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node scripts/app-version.ts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$(node scripts/app-version.ts --code)" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = tag ]; then
            if ! [[ "$REF_NAME" =~ ^app-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::The tag $REF_NAME isn't app-v<x.y.z>"
              exit 1
            fi
            if [ "$REF_NAME" != "app-v$version" ]; then
              echo "::error::The tag $REF_NAME doesn't match the app's version $version (set it with scripts/app-version.ts in a pull request, then tag the merge)"
              exit 1
            fi
          fi
      - if: steps.mode.outputs.publish == 'true' || steps.mode.outputs.desktop_only == 'true'
        name: On main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          # identical or behind: main has the commit
          status=$(gh api "repos/$REPO/compare/main...$sha" --jq .status)
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::The tagged commit $sha isn't on main ($status); tag a commit of main"
            exit 1
          fi
      # CI ran on main for this very commit and passed. A run still going is waited for (up to an
      # hour), so the tag can follow the merge right away.
      - if: steps.mode.outputs.publish == 'true' || steps.mode.outputs.desktop_only == 'true'
        name: CI passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          deadline=$((SECONDS + 3600))
          while :; do
            run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&branch=main&event=push&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.html_url)"')
            read -r status conclusion url <<< "$run"
            if [ -z "$run" ] && [ "$SECONDS" -gt 180 ]; then
              echo "::error::No CI run on main for $sha"
              exit 1
            fi
            if [ "$status" = completed ]; then
              if [ "$conclusion" != success ]; then
                echo "::error::CI on main for $sha: $conclusion ($url). Re-run it or tag a newer commit."
                exit 1
              fi
              echo "CI on main passed for $sha: $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$SECONDS" -gt "$deadline" ]; then
              echo "::error::CI on main for $sha didn't finish within an hour ($url)"
              exit 1
            fi
            echo "CI for $sha: ${status:-not started}, waiting"
            sleep 30
          done

  # The web bundle, as "Build app (web)" in ci.yml builds it (same tools and versions; the same job
  # id, so it starts from main's Rust cache). Another workflow's artifacts aren't at hand here.
  build-app:
    name: Build app (web)
    needs: check
    if: needs.check.outputs.android == 'true' || needs.check.outputs.ios == 'true' || needs.check.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install
      # Only main saves caches; a tag's would only be seen by that tag
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Install Trunk
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y trunk@0.22.0
      # The Microsoft Store's and the Snap Store's apps link their update to their page in the
      # store (api::app)
      - name: Build
        env:
          HASHI_MS_STORE_ID: ${{ vars.MS_STORE_APP_ID }}
          HASHI_SNAP_NAME: ${{ vars.SNAP_NAME }}
        run: pnpm run app:build --locked
      - uses: actions/upload-artifact@v7
        with:
          name: app-web-release
          path: target/app-dist
          retention-days: 1

  # The App Bundle for every architecture Play delivers (each phone gets its own), signed with the
  # upload key, and checked. Plus a universal APK, signed with the same key, for testers who
  # install it by hand.
  android:
    name: Build App Bundle (Android)
    needs: [check, build-app]
    if: needs.check.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      NDK_VERSION: 29.0.14206865
      # apksigner and zipalign for the checks
      BUILD_TOOLS_VERSION: 36.0.0
      VERSION: ${{ needs.check.outputs.version }}
      CODE: ${{ needs.check.outputs.code }}
      # Pinned with its checksum (the release has none of its own)
      BUNDLETOOL_VERSION: 1.18.3
      BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
      AAB: app/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Android NDK and bundletool
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "build-tools;$BUILD_TOOLS_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          curl -sSfL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum -c
      - run: rustup toolchain install && rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          save-if: false
      - name: Install the Tauri CLI
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y tauri-cli@2.12.4
      - uses: actions/download-artifact@v8
        with:
          name: app-web-release
          path: target/app-dist
      # The upload key in files of the runner's temp dir, gone at the end of the job (below).
      # Gradle gets the passwords through the environment of its step, bundletool reads them from
      # the files: a password can't break the format of keystore.properties then. Dry runs
      # without the secrets (pull requests of Dependabot or forks) sign with a throwaway key.
      - name: Upload key
        env:
          PUBLISH: ${{ needs.check.outputs.publish }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          key="$RUNNER_TEMP/upload-key"
          mkdir -m 700 "$key"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$key/upload.p12"
          elif [ "$PUBLISH" = true ]; then
            echo "::error::The secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD are needed"
            exit 1
          else
            echo "::notice::No upload key in this run's secrets, signed with a throwaway key"
            # PKCS12 has one password for the store and its keys
            KEYSTORE_PASSWORD=$(openssl rand -hex 16) KEY_ALIAS=upload
            KEY_PASSWORD=$KEYSTORE_PASSWORD
            keytool -genkeypair -keystore "$key/upload.p12" -storetype PKCS12 -alias upload -keyalg RSA \
              -validity 1 -dname "CN=Throwaway" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1
          fi
          printf '%s\n' "$KEYSTORE_PASSWORD" > "$key/store-password"
          printf '%s\n' "$KEY_PASSWORD" > "$key/key-password"
          printf '%s\n' "$KEY_ALIAS" > "$key/alias"
          echo "UPLOAD_KEY=$key" >> "$GITHUB_ENV"
      # Release, arm64 + 32-bit ARM + x86_64; without beforeBuildCommand, the bundle is there
      - name: Build
        working-directory: app/src-tauri
        run: |
          ANDROID_KEYSTORE_FILE="$UPLOAD_KEY/upload.p12" \
          ANDROID_KEYSTORE_PASSWORD=$(cat "$UPLOAD_KEY/store-password") \
          ANDROID_KEY_ALIAS=$(cat "$UPLOAD_KEY/alias") \
          ANDROID_KEY_PASSWORD=$(cat "$UPLOAD_KEY/key-password") \
            cargo tauri android build --ci --aab --target aarch64 armv7 x86_64 --config '{"build":{"beforeBuildCommand":null}}'
      - name: Universal APK
        run: |
          alias=$(cat "$UPLOAD_KEY/alias")
          mkdir -p release
          cp "$AAB" "release/hashi-$VERSION.aab"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --mode=universal \
            --bundle "release/hashi-$VERSION.aab" --output "$RUNNER_TEMP/universal.apks" \
            --ks "$UPLOAD_KEY/upload.p12" --ks-key-alias "$alias" \
            --ks-pass "file:$UPLOAD_KEY/store-password" --key-pass "file:$UPLOAD_KEY/key-password"
          unzip -p "$RUNNER_TEMP/universal.apks" universal.apk > "release/hashi-$VERSION-universal.apk"
          # The upload key's certificate, to compare the signatures with (not secret)
          keytool -exportcert -rfc -keystore "$UPLOAD_KEY/upload.p12" -alias "$alias" \
            -storepass:file "$UPLOAD_KEY/store-password" > "$RUNNER_TEMP/upload-cert.pem"
      - if: always()
        name: Remove the upload key
        run: rm -rf "$RUNNER_TEMP/upload-key"
      # Signed with the upload key (not the debug key), Play's checks of the bundle, the store's
      # ID and the version, every architecture there, its native code ready for 16 KB pages
      - name: Check
        run: |
          bundletool() { java -jar "$RUNNER_TEMP/bundletool.jar" "$@"; }
          # SHA-256 of a certificate as lowercase hex, as apksigner prints it
          fingerprint() { keytool -printcert "$@" | sed -n 's/^\s*SHA256: //p' | tr -d : | tr '[:upper:]' '[:lower:]'; }
          aab="release/hashi-$VERSION.aab"
          apk="release/hashi-$VERSION-universal.apk"
          fail() { echo "::error::$1"; exit 1; }

          expected=$(fingerprint -file "$RUNNER_TEMP/upload-cert.pem")
          [ -n "$expected" ] || fail "no fingerprint of the upload key"
          jarsigner -verify "$aab" | grep -q '^jar verified' || fail "the App Bundle's signature doesn't verify"
          [ "$(fingerprint -jarfile "$aab")" = "$expected" ] || fail "the App Bundle isn't signed with the upload key"
          build_tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          # Only APK signature schemes v2 and v3 (minSdk 24), keytool can't read those
          signers=$("$build_tools/apksigner" verify --print-certs "$apk") || fail "the universal APK's signature doesn't verify"
          digests=$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' <<< "$signers")
          [ "$digests" = "$expected" ] \
            || fail "the universal APK isn't signed with the upload key alone: ${digests//$'\n'/ }, not $expected"

          bundletool validate --bundle "$aab" > /dev/null
          manifest() { bundletool dump manifest --bundle "$aab" --xpath "$1"; }
          [ "$(manifest /manifest/@package)" = rs.hashi ] || fail "applicationId $(manifest /manifest/@package), not rs.hashi"
          [ "$(manifest /manifest/@android:versionCode)" = "$CODE" ] || fail "versionCode $(manifest /manifest/@android:versionCode), not $CODE"
          [ "$(manifest /manifest/@android:versionName)" = "$VERSION" ] || fail "versionName $(manifest /manifest/@android:versionName), not $VERSION"
          [ -z "$(manifest /manifest/application/@android:debuggable)" ] || fail "the App Bundle is debuggable"
          # Google Play Games on with the project id of app/achievements-play.json, else its SDK
          # never starts (its provider off, app/README.md, Games services)
          games_id=$(jq -r '.project_id // empty | tostring' app/achievements-play.json 2> /dev/null || true)
          games=$(manifest "/manifest/application/provider[@android:name='com.google.android.gms.games.provider.PlayGamesInitProvider']/@android:enabled")
          [ "$games" = "$([ -n "$games_id" ] && echo true || echo false)" ] \
            || fail "Play Games' provider enabled=$games, the project id is '${games_id}'"

          files=$(unzip -Z1 "$aab")
          for abi in arm64-v8a armeabi-v7a x86_64; do
            grep -qx "base/lib/$abi/libhashi_tauri_lib.so" <<< "$files" || fail "no native library for $abi"
            grep -qx "BUNDLE-METADATA/com.android.tools.build.debugsymbols/$abi/libhashi_tauri_lib.so.sym" <<< "$files" \
              || fail "no native symbols for $abi"
          done
          # 16 KB pages (Play requires them for 64-bit): the libraries' LOAD segments aligned to
          # 16 KB, and stored uncompressed and 16 KB-aligned in the APK
          readelf="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for abi in arm64-v8a x86_64; do
            unzip -p "$aab" "base/lib/$abi/libhashi_tauri_lib.so" > "$RUNNER_TEMP/lib.so"
            "$readelf" -lW "$RUNNER_TEMP/lib.so" | awk '$1 == "LOAD" { if (strtonum($NF) < 16384) bad = 1; n++ } END { exit bad || !n }' \
              || fail "$abi: the native library isn't aligned for 16 KB pages"
          done
          "$build_tools/zipalign" -c -P 16 4 "$apk" || fail "the universal APK isn't aligned for 16 KB pages"
          {
            echo "Signed with the upload key, SHA-256 $expected"
            echo
            if [ -n "$games_id" ]; then echo "Google Play Games: on, project $games_id"; else echo "Google Play Games: off (no project_id in app/achievements-play.json)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      # What a phone downloads (the arm64 split APKs Play makes from the bundle), and the files
      - name: Size
        run: |
          bundletool() { java -jar "$RUNNER_TEMP/bundletool.jar" "$@"; }
          aab="release/hashi-$VERSION.aab"
          bundletool build-apks --bundle "$aab" --output "$RUNNER_TEMP/split.apks"
          echo '{"supportedAbis":["arm64-v8a"],"supportedLocales":["en"],"screenDensity":440,"sdkVersion":35}' > "$RUNNER_TEMP/arm64.json"
          mb() { awk -v bytes="$1" 'BEGIN { printf "%.1f MB", bytes / 1048576 }'; }
          size=$(bundletool get-size total --apks "$RUNNER_TEMP/split.apks" --device-spec "$RUNNER_TEMP/arm64.json" | tail -n 1)
          {
            echo "| Android $VERSION (versionCode $CODE) | size |"
            echo "|---|---|"
            echo "| App Bundle (upload) | $(mb "$(stat -c %s "$aab")") |"
            echo "| Download for an arm64 phone (min-max) | $(mb "${size%%,*}") - $(mb "${size##*,}") |"
            echo "| Universal APK | $(mb "$(stat -c %s "release/hashi-$VERSION-universal.apk")") |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: release
          compression-level: 0
          retention-days: ${{ needs.check.outputs.publish == 'true' && 30 || 3 }}

  # The foss build (app/README.md, Android builds): without any proprietary code, as an APK per
  # ABI with its own versionCode (the version's times ten plus the ABI's digit), signed with the
  # direct key, which isn't the upload key. For our F-Droid repository, the GitHub release and the
  # other stores. A job of its own, so a failure here never holds up Google Play's bundle.
  # Built by app/fdroid/build.sh as F-Droid builds it from source (app/README.md, F-Droid): its
  # own web bundle with the script's pinned Rust, not the one of "Build app (web)", and the JDK
  # of F-Droid's build server, so F-Droid's APKs are these but for the signature and F-Droid
  # ships them signed with our key.
  android-foss:
    name: Build APKs (Android, foss)
    needs: [check]
    if: needs.check.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      built: ${{ steps.key.outputs.built }}
    env:
      NDK_VERSION: 29.0.14206865
      BUILD_TOOLS_VERSION: 36.0.0
      VERSION: ${{ needs.check.outputs.version }}
      CODE: ${{ needs.check.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      # Node 26 runs Tailwind (the bundle) and scripts/foss-apk.ts (the checks)
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # keytool for the key; Gradle with Debian's JDK 21 on F-Droid's build server, the same major
      # version here (javac's output is part of the APK)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # The direct key in files of the runner's temp dir, gone at the end of the job (below), as
      # the upload key in "Build App Bundle". A release without it skips the foss build; a dry run
      # without it (Dependabot, forks) signs with a throwaway key.
      - id: key
        name: Direct key
        env:
          PUBLISH: ${{ needs.check.outputs.publish }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DIRECT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DIRECT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_DIRECT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_DIRECT_KEY_PASSWORD }}
        run: |
          key="$RUNNER_TEMP/direct-key"
          mkdir -m 700 "$key"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$key/direct.p12"
          elif [ "$PUBLISH" = true ]; then
            echo "::notice::No direct key in this run's secrets (ANDROID_DIRECT_KEYSTORE_BASE64, ANDROID_DIRECT_KEYSTORE_PASSWORD, ANDROID_DIRECT_KEY_ALIAS, ANDROID_DIRECT_KEY_PASSWORD): no foss APKs, no F-Droid repository"
            echo "No direct key in this run's secrets: no foss APKs and no F-Droid repository (once the secrets are set, run this workflow on the tag with publish)." >> "$GITHUB_STEP_SUMMARY"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "::notice::No direct key in this run's secrets, signed with a throwaway key"
            KEYSTORE_PASSWORD=$(openssl rand -hex 16) KEY_ALIAS=hashi-direct
            KEY_PASSWORD=$KEYSTORE_PASSWORD
            keytool -genkeypair -keystore "$key/direct.p12" -storetype PKCS12 -alias "$KEY_ALIAS" -keyalg RSA \
              -validity 1 -dname "CN=Throwaway" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1
          fi
          printf '%s\n' "$KEYSTORE_PASSWORD" > "$key/store-password"
          printf '%s\n' "$KEY_PASSWORD" > "$key/key-password"
          printf '%s\n' "$KEY_ALIAS" > "$key/alias"
          # Its certificate, to compare the signatures with (not secret)
          keytool -exportcert -rfc -keystore "$key/direct.p12" -alias "$KEY_ALIAS" \
            -storepass:file "$key/store-password" > "$RUNNER_TEMP/direct-cert.pem"
          echo "DIRECT_KEY=$key" >> "$GITHUB_ENV"
          echo "built=true" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.built == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true
      - if: steps.key.outputs.built == 'true'
        name: Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "build-tools;$BUILD_TOOLS_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      # Tailwind, and the fonts of public/fonts (postinstall)
      - if: steps.key.outputs.built == 'true'
        run: pnpm install --frozen-lockfile
      # The script installs its pinned Rust and the targets; no Rust cache, its rustc isn't the one
      # of the other jobs. Trunk and the Tauri CLI prebuilt (F-Droid compiles them, the same
      # versions), Trunk downloads wasm-bindgen and wasm-opt of the versions it is pinned to.
      - if: steps.key.outputs.built == 'true'
        name: Install Trunk and the Tauri CLI
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y trunk@0.22.0 tauri-cli@2.12.4
      # Release, an APK per ABI (arm64 + 32-bit ARM + x86_64), with the web bundle. In a copy of the
      # checkout where F-Droid's build server builds (/home/vagrant/build/rs.hashi): Cargo hashes
      # the absolute path of the path dependencies outside app/src-tauri's workspace (backend,
      # common, ...) into their symbols, and the library's code differed elsewhere.
      - if: steps.key.outputs.built == 'true'
        name: Build
        run: |
          sudo mkdir -p /home/vagrant/build
          sudo chown -R "$USER" /home/vagrant
          cp -a . /home/vagrant/build/rs.hashi
          (cd /home/vagrant/build/rs.hashi &&
            ANDROID_KEYSTORE_FILE="$DIRECT_KEY/direct.p12" \
            ANDROID_KEYSTORE_PASSWORD=$(cat "$DIRECT_KEY/store-password") \
            ANDROID_KEY_ALIAS=$(cat "$DIRECT_KEY/alias") \
            ANDROID_KEY_PASSWORD=$(cat "$DIRECT_KEY/key-password") \
              app/fdroid/build.sh apk arm64 arm x86_64)
          mkdir -p release
          for flavor in arm64:arm64-v8a arm:armeabi-v7a x86_64:x86_64; do
            cp "/home/vagrant/build/rs.hashi/app/src-tauri/gen/android/app/build/outputs/apk/${flavor%%:*}/release/app-${flavor%%:*}-release.apk" \
              "release/hashi-$VERSION-foss-${flavor#*:}.apk"
          done
      - if: always()
        name: Remove the direct key
        run: rm -rf "$RUNNER_TEMP/direct-key"
      # Signed with the direct key alone (not the upload key, not a debug key), the store's ID, the
      # versionCodes, each ABI's library and nothing else, 16 KB pages, and nothing proprietary: no
      # class of Google Play services, Firebase or the Play Core libraries, nothing of Google in
      # the manifest, no dependency list encrypted for Google in the signing block
      - if: steps.key.outputs.built == 'true'
        name: Check
        run: |
          fail() { echo "::error::$1"; exit 1; }
          build_tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          expected=$(keytool -printcert -file "$RUNNER_TEMP/direct-cert.pem" | sed -n 's/^\s*SHA256: //p' | tr -d : | tr '[:upper:]' '[:lower:]')
          [ -n "$expected" ] || fail "no fingerprint of the direct key"
          node scripts/foss-apk.ts --build-tools "$build_tools" --cert "$expected" \
            --version "$VERSION" --code "$CODE" release/hashi-"$VERSION"-foss-*.apk
          {
            echo "Foss APKs signed with the direct key, SHA-256 $expected"
            echo
            echo "| Android $VERSION, foss | versionCode | size |"
            echo "|---|---|---|"
            for apk in release/*.apk; do
              code=$("$build_tools/aapt2" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
              echo "| $(basename "$apk") | $code | $(awk -v b="$(stat -c %s "$apk")" 'BEGIN { printf "%.1f MB", b / 1048576 }') |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.key.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-foss-release
          path: release
          compression-level: 0
          retention-days: ${{ needs.check.outputs.publish == 'true' && 30 || 3 }}

  # The IPA for the App Store, as "Build app (iOS)" in ci.yml builds the app (same runner image,
  # Xcode and CLI) but for devices, in release, and signed. Tauri archives it unsigned, then Xcode
  # exports the archive for App Store Connect with automatic signing: with the API key
  # (-allowProvisioningUpdates and -authenticationKey*) it makes or reuses the team's
  # cloud-managed distribution certificate and the App Store profile for rs.hashi, nothing to keep
  # in secrets. Publishing then uploads the same archive to App Store Connect.
  ios:
    name: Build IPA (iOS)
    needs: [check, build-app]
    if: needs.check.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      # The Xcode of ci.yml; its SDK is iOS 27.1, which the iPhone Duo's inner display needs to
      # show the app full-screen (the App Store takes the iOS 26 SDK or newer)
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      VERSION: ${{ needs.check.outputs.version }}
      CODE: ${{ needs.check.outputs.code }}
      # The team of the signing, Tauri writes it into the Xcode project (not a secret)
      APPLE_DEVELOPMENT_TEAM: Q35TCGM5PW
      ARCHIVE: app/src-tauri/gen/apple/build/hashi_tauri_iOS.xcarchive
      IPA: app/src-tauri/gen/apple/build/arm64/Hashi.ipa
    steps:
      - uses: actions/checkout@v7
      - name: Xcode
        run: xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
      - run: rustup toolchain install && rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          save-if: false
      # The arm64 build of the CLI, as in ci.yml
      - name: Install the Tauri CLI
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --targets aarch64-apple-darwin --pkg-fmt zip tauri-cli@2.12.4
          file ~/.cargo/bin/cargo-tauri | grep -q arm64
      - uses: actions/download-artifact@v8
        with:
          name: app-web-release
          path: target/app-dist
      # The API key's .p8 in a file of the runner's temp dir, gone at the end of the job (below).
      # Tauri passes it on to xcodebuild through APPLE_API_KEY, APPLE_API_ISSUER and
      # APPLE_API_KEY_PATH.
      - name: API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/api-key"
          mkdir -m 700 "$key"
          (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$key/AuthKey_$APPLE_API_KEY_ID.p8")
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$key/AuthKey_$APPLE_API_KEY_ID.p8" \
            || { echo "::error::APPLE_API_KEY_P8 isn't the content of the key's .p8 file"; exit 1; }
          {
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$key/AuthKey_$APPLE_API_KEY_ID.p8"
          } >> "$GITHUB_ENV"
      # Release, arm64, without beforeBuildCommand (the bundle is there). CFBundleVersion, the build
      # number App Store Connect counts, is the versionCode: it grows with every version, and
      # --build-number would append it as a fourth number, which App Store Connect refuses.
      - name: Build
        working-directory: app/src-tauri
        run: |
          config=$(jq -nc --arg code "$CODE" '{build: {beforeBuildCommand: null}, bundle: {iOS: {bundleVersion: $code}}}')
          cargo tauri ios build --ci --target aarch64 --export-method app-store-connect --config "$config"
      # Signed for the App Store by the team (an Apple Distribution certificate and an App Store
      # profile: no devices, TestFlight allowed, not debuggable), the store's ID with the Universal
      # Links' domain and Game Center, the version and build number, the export compliance answer,
      # arm64
      - name: Check
        run: |
          fail() { echo "::error::$1"; exit 1; }
          work="$RUNNER_TEMP/ipa"
          rm -rf "$work" && mkdir "$work"
          unzip -q "$IPA" -d "$work"
          app="$work/Payload/Hashi.app"
          [ -d "$app" ] || fail "no Payload/Hashi.app in the IPA"
          codesign --verify --strict --deep "$app" || fail "the app's signature doesn't verify"
          signature=$(codesign -dvv "$app" 2>&1)
          authority=$(sed -n 's/^Authority=//p' <<< "$signature" | head -n 1)
          team=$(sed -n 's/^TeamIdentifier=//p' <<< "$signature")
          [[ "$authority" == "Apple Distribution: "* ]] || fail "signed by $authority, not an Apple Distribution certificate"
          [ "$team" = "$APPLE_DEVELOPMENT_TEAM" ] || fail "signed for the team $team, not $APPLE_DEVELOPMENT_TEAM"

          codesign -d --entitlements "$RUNNER_TEMP/entitlements.plist" --xml "$app" 2> /dev/null
          security cms -D -i "$app/embedded.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          get() { /usr/libexec/PlistBuddy -c "Print :$2" "$1" 2> /dev/null; }
          entitlement() { get "$RUNNER_TEMP/entitlements.plist" "$1"; }
          [ "$(entitlement application-identifier)" = "$APPLE_DEVELOPMENT_TEAM.rs.hashi" ] \
            || fail "application-identifier $(entitlement application-identifier), not $APPLE_DEVELOPMENT_TEAM.rs.hashi"
          [ "$(entitlement get-task-allow)" = false ] || fail "the app is debuggable (get-task-allow)"
          [ "$(entitlement beta-reports-active)" = true ] || fail "not signed for TestFlight (beta-reports-active)"
          entitlement com.apple.developer.associated-domains | grep -qE '^[[:space:]]*applinks:hashi\.rs$' \
            || fail "the Associated Domains don't have applinks:hashi.rs"
          # Game Center (HashiPlugin.swift): the App ID's capability, in the App Store profile
          [ "$(entitlement com.apple.developer.game-center)" = true ] || fail "no Game Center entitlement (com.apple.developer.game-center)"
          [ "$(get "$RUNNER_TEMP/profile.plist" Entitlements:com.apple.developer.game-center)" = true ] \
            || fail "the profile $(get "$RUNNER_TEMP/profile.plist" Name) has no Game Center"
          profile=$(get "$RUNNER_TEMP/profile.plist" Name)
          [ -z "$(get "$RUNNER_TEMP/profile.plist" ProvisionedDevices)" ] || fail "the profile $profile has devices, it isn't an App Store one"

          info() { get "$app/Info.plist" "$1"; }
          [ "$(info CFBundleIdentifier)" = rs.hashi ] || fail "CFBundleIdentifier $(info CFBundleIdentifier), not rs.hashi"
          [ "$(info CFBundleShortVersionString)" = "$VERSION" ] || fail "CFBundleShortVersionString $(info CFBundleShortVersionString), not $VERSION"
          [ "$(info CFBundleVersion)" = "$CODE" ] || fail "CFBundleVersion $(info CFBundleVersion), not $CODE"
          [ "$(info ITSAppUsesNonExemptEncryption)" = false ] || fail "ITSAppUsesNonExemptEncryption isn't false"
          [ "$(lipo -archs "$app/Hashi")" = arm64 ] || fail "the binary is $(lipo -archs "$app/Hashi"), not arm64"
          {
            echo "Signed by $authority (team $team), profile $profile"
            echo
            echo "SDK $(info DTSDKName), Xcode $(info DTXcode), iOS $(info MinimumOSVersion) and newer"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Size
        run: |
          mkdir -p release
          cp "$IPA" "release/hashi-$VERSION.ipa"
          mb() { awk -v kb="$1" 'BEGIN { printf "%.1f MB", kb / 1024 }'; }
          {
            echo "| iOS $VERSION (build $CODE) | size |"
            echo "|---|---|"
            echo "| IPA (upload) | $(mb "$(du -k "release/hashi-$VERSION.ipa" | cut -f1)") |"
            echo "| Hashi.app | $(mb "$(du -sk "$RUNNER_TEMP/ipa/Payload/Hashi.app" | cut -f1)") |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: release
          compression-level: 0
          retention-days: ${{ needs.check.outputs.publish == 'true' && 30 || 3 }}
      # The archive once more, exported straight to App Store Connect (`destination: upload`, with
      # its symbols): xcodebuild's own upload, with the same key. App Store Connect refuses a build
      # number it already has, so a re-run needs a new version. TestFlight has the build once Apple
      # has processed it (minutes to an hour); internal testers get it from there.
      - if: needs.check.outputs.publish == 'true'
        name: Upload to App Store Connect
        run: |
          # manageAppVersionAndBuildNumber off: the build number is ours (CFBundleVersion above)
          options="$RUNNER_TEMP/upload.plist"
          cat > "$options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_DEVELOPMENT_TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          plutil -lint "$options"
          xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/upload" -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_API_KEY_PATH" -authenticationKeyID "$APPLE_API_KEY" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER"
          echo "Uploaded $VERSION (build $CODE) to App Store Connect, in TestFlight once Apple has processed it" >> "$GITHUB_STEP_SUMMARY"
      # Xcode's log of a failed export or upload: its errors only, the full log has the session's
      # requests
      - if: failure()
        name: Xcode's errors
        run: |
          find "${TMPDIR:-/tmp}" -name 'IDEDistribution.standard.log' -path '*.xcdistributionlogs/*' 2> /dev/null \
            | while read -r log; do echo "== $log"; grep -iE 'error|fail' "$log" | head -n 100; done
      - if: always()
        name: Remove the API key
        run: rm -rf "$RUNNER_TEMP/api-key"

  # The desktop installers (docs/stores.md, Desktop builds), from the same web bundle: Tauri's
  # bundles of each system, built on it (Windows arm64 cross-compiled on x64, macOS universal for
  # Apple silicon and Intel), in release. Named hashi-<version>-<system>-<arch>.<ext> for the
  # GitHub release and the desktop stores' uploads.
  # - Linux on Ubuntu 22.04, the oldest the runners have: the AppImage and the binaries run on
  #   systems with its glibc (2.35) or a newer one. The AppImage brings GStreamer for the sounds.
  # - Windows: unsigned (docs/stores.md has the options); the NSIS installer per user, without
  #   admin rights, the MSI for x64 only (Tauri's WiX 3 makes none for arm64).
  # - macOS: signed with the Developer ID certificate and notarized (Tauri, with the App Store
  #   Connect API key) once APPLE_DEVELOPER_ID_CERT_BASE64 and APPLE_DEVELOPER_ID_CERT_PASSWORD
  #   are set; until then signed ad hoc (Gatekeeper refuses to open it until the user allows it in
  #   System Settings), with a notice.
  desktop:
    name: Build desktop (${{ matrix.name }})
    needs: [check, build-app]
    if: needs.check.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            system: linux
            arch: x64
            runner: ubuntu-22.04
            bundles: deb,rpm,appimage
          - name: Linux arm64
            system: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            bundles: deb,rpm,appimage
          - name: Windows x64
            system: windows
            arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Windows arm64
            system: windows
            arch: arm64
            runner: windows-2025
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: macOS
            system: macos
            arch: universal
            runner: macos-26
            target: universal-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.check.outputs.version }}
      SYSTEM: ${{ matrix.system }}
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
      # linuxdeploy, an AppImage itself, unpacks itself instead of needing FUSE
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v7
      # What Tauri needs on Linux (WebKitGTK and its kin), and patchelf for GStreamer in the AppImage
      - if: matrix.system == 'linux'
        name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Rust
        run: |
          rustup toolchain install
          case "$TARGET" in
            universal-apple-darwin) rustup target add aarch64-apple-darwin x86_64-apple-darwin ;;
            ?*) rustup target add "$TARGET" ;;
          esac
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      # The CLI of the other jobs; the arm64 one on the Mac, as there
      - name: Install the Tauri CLI
        run: |
          if [ "$SYSTEM" = macos ]; then
            cargo binstall -y --targets aarch64-apple-darwin --pkg-fmt zip tauri-cli@2.12.4
          else
            cargo binstall -y tauri-cli@2.12.4
          fi
          cargo tauri --version
      - uses: actions/download-artifact@v8
        with:
          name: app-web-release
          path: target/app-dist
      # macOS: the Developer ID certificate, which Tauri imports into a keychain of its own
      # (APPLE_CERTIFICATE), and the App Store Connect API key for the notarization, in a file of
      # the runner's temp dir, gone at the end of the job (below)
      - if: matrix.system == 'macos'
        id: signing
        name: Signing
        env:
          CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$CERT" ] || [ -z "$CERT_PASSWORD" ]; then
            echo "::notice::No Developer ID certificate in this run's secrets (APPLE_DEVELOPER_ID_CERT_BASE64, APPLE_DEVELOPER_ID_CERT_PASSWORD), the Mac app is signed ad hoc and not notarized"
            echo "No Developer ID certificate in this run's secrets: the Mac app is signed ad hoc and not notarized (once they are set: \`gh workflow run app-release.yml --ref app-v$VERSION -f desktop=true\`)." >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::The Developer ID certificate is there, but not the App Store Connect API key for the notarization (APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_API_KEY_P8)"
            exit 1
          fi
          key="$RUNNER_TEMP/api-key"
          mkdir -m 700 "$key"
          (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$key/AuthKey_$APPLE_API_KEY_ID.p8")
          {
            echo "APPLE_CERTIFICATE=$CERT"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$key/AuthKey_$APPLE_API_KEY_ID.p8"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - if: matrix.system == 'windows'
        name: Signing
        run: |
          echo "::notice::The Windows installers are unsigned (docs/stores.md, Desktop builds): SmartScreen warns before they run"
      # Node 26 runs scripts/snap-store.ts (Linux) and scripts/microsoft-store.ts (Windows)
      - if: matrix.system != 'macos'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # Linux: the AppStream MetaInfo for the .deb and the .rpm (and through the .deb the snap), from
      # the store texts, with the date of the tagged commit. "Snap" checks it (Ubuntu 22.04's
      # appstreamcli predates AppStream 1.0's tags).
      - if: matrix.system == 'linux'
        name: MetaInfo
        run: |
          node scripts/snap-store.ts metainfo --version "$VERSION" --date "$(git log -1 --format=%cs)" \
            --whatsnew app/store/whatsnew/whatsnew-en-US --out "$RUNNER_TEMP/rs.hashi.metainfo.xml"
          # For the check of the .rpm below
          sudo apt-get install -y --no-install-recommends rpm
      # Release, without beforeBuildCommand (the bundle is there). Signed: the identity Tauri finds
      # in the imported certificate's keychain, the only one there.
      - name: Build
        working-directory: app/src-tauri
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          config='{"build": {"beforeBuildCommand": null}}'
          if [ "$SIGNED" = true ]; then
            config=$(jq -c '.bundle.macOS.signingIdentity = "Developer ID Application"' <<< "$config")
          fi
          if [ "$SYSTEM" = linux ]; then
            config=$(jq -c --arg file "$RUNNER_TEMP/rs.hashi.metainfo.xml" \
              '.bundle.linux.deb.files["/usr/share/metainfo/rs.hashi.metainfo.xml"] = $file
              | .bundle.linux.rpm.files["/usr/share/metainfo/rs.hashi.metainfo.xml"] = $file' <<< "$config")
          fi
          args=(--ci --bundles "$BUNDLES" --config "$config")
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          cargo tauri build "${args[@]}"
      # Windows: the MSIX package of this architecture for the Microsoft Store (docs/stores.md,
      # Microsoft Store): the same hashi.exe in a package folder with its manifest and logos
      # (scripts/microsoft-store.ts), the logos' sizes indexed by MakePri, packed by MakeAppx, which
      # checks the manifest against its schema. Unsigned: the Store signs it. "Microsoft Store
      # package" bundles both architectures.
      - if: matrix.system == 'windows'
        name: MSIX package
        shell: pwsh
        env:
          MS_STORE_IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
          MS_STORE_PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
          MS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}
          MS_STORE_DISPLAY_NAME: ${{ vars.MS_STORE_DISPLAY_NAME }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # The newest Windows SDK's tools
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\makeappx.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1 | ForEach-Object { $_.DirectoryName }
          if (-not $sdk) { throw 'no Windows SDK with makeappx.exe' }
          "Windows SDK tools: $sdk"
          $layout = Join-Path $env:RUNNER_TEMP "msix-$env:ARCH"
          node scripts/microsoft-store.ts layout --version $env:VERSION --arch $env:ARCH `
            --exe "app/src-tauri/target/$env:TARGET/release/hashi.exe" --out $layout
          $config = Join-Path $env:RUNNER_TEMP 'priconfig.xml'
          & "$sdk\makepri.exe" createconfig /cf $config /dq en-US /pv 10.0.0 /o
          & "$sdk\makepri.exe" new /pr $layout /cf $config /mn "$layout\AppxManifest.xml" /of "$layout\resources.pri" /o
          New-Item -ItemType Directory -Force msix | Out-Null
          & "$sdk\makeappx.exe" pack /d $layout /p "msix\hashi-$env:VERSION-windows-$env:ARCH.msix" /o
          Get-ChildItem msix
      - if: matrix.system == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: msix-windows-${{ matrix.arch }}
          path: msix
          compression-level: 0
          retention-days: 1
      # The installers under their release names, in release/
      - name: Collect
        run: |
          bundle="app/src-tauri/target/${TARGET:+$TARGET/}release/bundle"
          name="hashi-$VERSION-$SYSTEM-$ARCH"
          mkdir -p release
          one() {
            local files=("$@")
            [ "${#files[@]}" -eq 1 ] && [ -f "${files[0]}" ] || { echo "::error::not one file: ${files[*]}"; exit 1; }
            printf '%s' "${files[0]}"
          }
          case "$SYSTEM" in
            linux)
              cp "$(one "$bundle"/deb/*.deb)" "release/$name.deb"
              cp "$(one "$bundle"/rpm/*.rpm)" "release/$name.rpm"
              cp "$(one "$bundle"/appimage/*.AppImage)" "release/$name.AppImage"
              ;;
            windows)
              cp "$(one "$bundle"/nsis/*-setup.exe)" "release/$name-setup.exe"
              if [[ "$BUNDLES" == *msi* ]]; then cp "$(one "$bundle"/msi/*.msi)" "release/$name.msi"; fi
              ;;
            macos)
              cp "$(one "$bundle"/dmg/*.dmg)" "release/$name.dmg"
              # The app itself, for the stores that take a zip (ditto keeps its signature)
              ditto -c -k --keepParent "$bundle/macos/Hashi.app" "release/$name.app.zip"
              ;;
          esac
          ls -l release
      # The version, the architectures and, on the Mac, the signature. (The Mac's bash is 3.2.)
      - name: Check
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          name="release/hashi-$VERSION-$SYSTEM-$ARCH"
          case "$SYSTEM" in
            linux)
              deb_arch=$ARCH
              if [ "$ARCH" = x64 ]; then deb_arch=amd64; fi
              [ "$(dpkg-deb -f "$name.deb" Package)" = hashi ] || fail "the package is $(dpkg-deb -f "$name.deb" Package), not hashi"
              [ "$(dpkg-deb -f "$name.deb" Version)" = "$VERSION" ] || fail "the package's version is $(dpkg-deb -f "$name.deb" Version), not $VERSION"
              [ "$(dpkg-deb -f "$name.deb" Architecture)" = "$deb_arch" ] || fail "the package is for $(dpkg-deb -f "$name.deb" Architecture), not $deb_arch"
              # The lists first: grep -q stops reading at its match, and pipefail would take the
              # writer's broken pipe for a failure
              deb_files=$(dpkg-deb -c "$name.deb")
              rpm_files=$(rpm -qlp "$name.rpm")
              grep -qE ' (\./)?usr/share/applications/Hashi\.desktop$' <<< "$deb_files" || fail "the package has no desktop entry"
              grep -qE ' (\./)?usr/share/metainfo/rs\.hashi\.metainfo\.xml$' <<< "$deb_files" || fail "the package has no MetaInfo"
              grep -qx /usr/share/metainfo/rs.hashi.metainfo.xml <<< "$rpm_files" || fail "the rpm has no MetaInfo"
              ;;
            macos)
              app="$RUNNER_TEMP/app"
              rm -rf "$app" && mkdir "$app"
              ditto -x -k "$name.app.zip" "$app"
              app="$app/Hashi.app"
              info() { /usr/libexec/PlistBuddy -c "Print :$1" "$app/Contents/Info.plist"; }
              [ "$(info CFBundleIdentifier)" = rs.hashi ] || fail "CFBundleIdentifier $(info CFBundleIdentifier), not rs.hashi"
              [ "$(info CFBundleShortVersionString)" = "$VERSION" ] || fail "CFBundleShortVersionString $(info CFBundleShortVersionString), not $VERSION"
              binary="$app/Contents/MacOS/$(info CFBundleExecutable)"
              archs=$(lipo -archs "$binary")
              [ "$archs" = "x86_64 arm64" ] || fail "the binary is $archs, not x86_64 arm64"
              codesign --verify --strict --deep "$app" || fail "the app's signature doesn't verify"
              authority=$(codesign -dvv "$app" 2>&1 | sed -n 's/^Authority=//p' | head -n 1)
              if [ "$SIGNED" = true ]; then
                [[ "$authority" == "Developer ID Application: "* ]] || fail "signed by ${authority:-nobody}, not a Developer ID Application certificate"
                xcrun stapler validate "$app" || fail "the app has no notarization ticket"
                spctl --assess --type execute -vv "$app" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
                grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt" || fail "Gatekeeper doesn't take the app as notarized"
                echo "Signed by $authority and notarized" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Signed ad hoc, not notarized" >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
          esac
      - name: Size
        run: |
          mb() { awk -v bytes="$(wc -c < "$1")" 'BEGIN { printf "%.1f MB", bytes / 1048576 }'; }
          {
            echo "| $SYSTEM $ARCH $VERSION | size |"
            echo "|---|---|"
            for file in release/*; do echo "| $(basename "$file") | $(mb "$file") |"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.system }}-${{ matrix.arch }}
          path: release
          compression-level: 0
          retention-days: ${{ needs.check.outputs.publish == 'true' && 30 || 3 }}
      - if: always() && matrix.system == 'macos'
        name: Remove the API key
        run: rm -rf "$RUNNER_TEMP/api-key"

  # The bundle and the APK on the tag's GitHub release: the source of the first upload, which has
  # to be done by hand in the Play Console. The foss APKs, for those who install by hand, and the
  # F-Droid repository's store of older versions. And the IPA, when iOS was built, and the desktop
  # installers: a failed or skipped foss, iOS or desktop build doesn't hold up Android's files (a
  # re-run of it adds them). `desktop` replaces only the desktop installers of the release.
  # The Microsoft Store's package (docs/stores.md, Microsoft Store): the MSIX packages of both
  # Windows architectures in one bundle, version x.y.z.0, unsigned (the Store signs it). Checked:
  # every manifest (scripts/microsoft-store.ts: the identity, the version, x64 and arm64, full
  # trust), then installed on this runner, signed with a throwaway certificate of its publisher
  # that only this runner trusts, and started: the app has to show its window from the package
  # (a screenshot in the artifact msstore-smoke). Built with the Store's identity (the
  # repository variables MS_STORE_IDENTITY_NAME, MS_STORE_PUBLISHER), it goes onto the GitHub
  # release and to the Store; without it with a placeholder, for the checks only.
  msstore-package:
    name: Microsoft Store package
    needs: [check, desktop]
    if: ${{ !cancelled() && needs.check.outputs.desktop == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 20
    outputs:
      identity: ${{ steps.bundle.outputs.identity }}
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.check.outputs.version }}
      MS_STORE_IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
      MS_STORE_PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
      MS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}
      MS_STORE_DISPLAY_NAME: ${{ vars.MS_STORE_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8
        with:
          pattern: msix-windows-*
          path: msix
          merge-multiple: true
      - id: bundle
        name: Bundle
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\makeappx.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1 | ForEach-Object { $_.DirectoryName }
          if (-not $sdk) { throw 'no Windows SDK with makeappx.exe' }
          "sdk=$sdk" >> $env:GITHUB_OUTPUT
          Get-ChildItem msix
          New-Item -ItemType Directory -Force release | Out-Null
          & "$sdk\makeappx.exe" bundle /d msix /p "release\hashi-$env:VERSION-windows-store.msixbundle" /bv "$env:VERSION.0" /o
          if ($env:MS_STORE_IDENTITY_NAME -and $env:MS_STORE_PUBLISHER) {
            "identity=store" >> $env:GITHUB_OUTPUT
          } else {
            "::notice::No Store identity in the repository variables (MS_STORE_IDENTITY_NAME, MS_STORE_PUBLISHER), the MSIX bundle has a placeholder: checked, not released"
            "identity=placeholder" >> $env:GITHUB_OUTPUT
          }
      # The bundle's and every package's manifest, as the upload checks them
      - name: Check
        run: node scripts/microsoft-store.ts release --version $env:VERSION --dry-run "release/hashi-$env:VERSION-windows-store.msixbundle"
      - name: Install and start
        env:
          SDK: ${{ steps.bundle.outputs.sdk }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $placeholder = -not ($env:MS_STORE_IDENTITY_NAME -and $env:MS_STORE_PUBLISHER)
          $name = if ($placeholder) { 'rs.hashi.placeholder' } else { $env:MS_STORE_IDENTITY_NAME.Trim() }
          $publisher = if ($placeholder) { 'CN=Hashi Placeholder' } else { $env:MS_STORE_PUBLISHER.Trim() }
          # A throwaway certificate of the package's publisher, trusted by this runner only, signs a copy
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -FriendlyName 'Hashi MSIX test' -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\test.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\test.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $copy = Join-Path $env:RUNNER_TEMP 'test.msixbundle'
          Copy-Item "release\hashi-$env:VERSION-windows-store.msixbundle" $copy
          & "$env:SDK\signtool.exe" sign /fd SHA256 /sha1 $cert.Thumbprint /s My $copy
          Add-AppxPackage -Path $copy
          $package = Get-AppxPackage -Name $name
          if (-not $package) { throw "the package $name isn't installed" }
          "Installed $($package.PackageFullName) ($($package.Architecture)) in $($package.InstallLocation)"
          $webview = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          "WebView2: $($webview.pv)"
          Start-Process "shell:AppsFolder\$($package.PackageFamilyName)!Hashi"
          Start-Sleep -Seconds 20
          $process = Get-Process hashi -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$($package.InstallLocation)*" }
          if (-not $process) { throw 'the app from the package is not running after 20 s' }
          New-Item -ItemType Directory -Force smoke | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $image = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($image).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $image.Save((Join-Path (Get-Location) 'smoke\msix.png'))
          $title = $process.MainWindowTitle
          "Running: $($process.Path), window '$title'"
          if ($title -ne 'Hashi') { throw "the app's window is '$title', not Hashi" }
          # What desktop.rs looks for to tell the page it is the Store's app (msstore)
          if (-not (Test-Path (Join-Path (Split-Path $process.Path) 'AppxManifest.xml'))) { throw 'no AppxManifest.xml beside the program' }
          "The app from the package ($($package.Architecture)) runs and shows its window" >> $env:GITHUB_STEP_SUMMARY
          $process | Stop-Process
          Remove-AppxPackage $package.PackageFullName
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msstore-smoke
          path: smoke
          if-no-files-found: ignore
          retention-days: 7
      - name: Size
        run: |
          $lines = @("| Microsoft Store $env:VERSION | size |", '|---|---|')
          $lines += Get-ChildItem release | ForEach-Object { "| $($_.Name) | $([math]::Round($_.Length / 1MB, 1)) MB |" }
          $lines >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: msstore-release
          path: release
          compression-level: 0
          retention-days: ${{ needs.check.outputs.publish == 'true' && 30 || 3 }}

  # The Snap Store's snaps (docs/stores.md, Snap Store), one per architecture, on a runner of it:
  # the Linux .deb of "Build desktop" unpacked into a snap (app/linux/snap/snapcraft.yaml: core24,
  # strict, GNOME's extension for GTK and WebKitGTK), built by snapcraft in an LXD container
  # (snapcore/action-build). Checked: its meta/snap.yaml (scripts/snap-store.ts: the name, the
  # version, the architecture, core24, strict, stable) and the MetaInfo in it (appstreamcli), then
  # installed (unsigned, --dangerous) and started on a virtual display with hashi.rs blocked, like
  # "Build app (desktop)" in ci.yml: the window has to show the page, the program has to run from
  # the snap (what desktop.rs looks for to tell the page it is the snap). The name is the
  # repository variable SNAP_NAME, hashi without it.
  snap:
    name: Snap (${{ matrix.arch }})
    needs: [check, desktop]
    if: ${{ !cancelled() && needs.check.outputs.desktop == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.check.outputs.version }}
      ARCH: ${{ matrix.arch }}
      SNAP_NAME: ${{ vars.SNAP_NAME || 'hashi' }}
    steps:
      - uses: actions/checkout@v7
      # Node 26 runs scripts/snap-store.ts
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: desktop
      # The project: the .deb, the snap's icon (the app's 512 px one) and its name
      - name: Snap project
        run: |
          mkdir -p app/linux/snap/local app/linux/snap/gui
          cp "desktop/hashi-$VERSION-linux-$ARCH.deb" app/linux/snap/local/hashi.deb
          cp app/src-tauri/icons/icon.png app/linux/snap/gui/icon.png
          sed -i "s/^name: hashi\$/name: $SNAP_NAME/" app/linux/snap/snapcraft.yaml
          grep -qx "name: $SNAP_NAME" app/linux/snap/snapcraft.yaml
      - id: build
        uses: snapcore/action-build@v1
        with:
          path: app/linux
      - name: Check
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          mkdir -p release
          cp "$SNAP_FILE" "release/hashi-$VERSION-linux-$ARCH.snap"
          command -v unsquashfs > /dev/null || sudo apt-get install -y --no-install-recommends squashfs-tools
          node scripts/snap-store.ts release --version "$VERSION" --dry-run "release/hashi-$VERSION-linux-$ARCH.snap"
          unsquashfs -cat "release/hashi-$VERSION-linux-$ARCH.snap" meta/snap.yaml
          # The MetaInfo the .deb brought, by AppStream 1.0's rules (rs.hashi has only two parts,
          # which appstreamcli would like to be three: only a hint)
          unsquashfs -cat "release/hashi-$VERSION-linux-$ARCH.snap" usr/share/metainfo/rs.hashi.metainfo.xml > "$RUNNER_TEMP/rs.hashi.metainfo.xml"
          sudo apt-get install -y --no-install-recommends appstream
          appstreamcli validate --no-net --explain --override=cid-desktopapp-is-not-rdns=info "$RUNNER_TEMP/rs.hashi.metainfo.xml"
      - name: Install and start
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xdotool imagemagick
          # The platform snaps of GNOME's extension, which the store would install with it
          sudo snap install gnome-46-2404 mesa-2404 gtk-common-themes
          sudo snap install --dangerous "release/hashi-$VERSION-linux-$ARCH.snap"
          snap connections "$SNAP_NAME"
          echo "127.0.0.1 hashi.rs" | sudo tee -a /etc/hosts
          # snap run puts the app into a scope of the user's systemd (snapd's cgroup of the
          # snap), which the runner's shell, a system service, doesn't have: a user manager with
          # its session bus, as a desktop session would have it
          sudo apt-get install -y --no-install-recommends dbus-user-session
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          Xvfb :99 -screen 0 1280x800x24 &
          export DISPLAY=:99
          sleep 2
          snap run "$SNAP_NAME" > app.log 2>&1 &
          sleep 30
          mkdir -p smoke
          import -window root smoke/snap.png
          cp app.log smoke/
          colors=$(convert smoke/snap.png -format %k info:)
          echo "Screenshot: $colors colours"
          pid=$(pgrep -x hashi | head -n 1)
          [ -n "$pid" ] || { cat app.log; echo "::error::the app from the snap isn't running after 30 s"; exit 1; }
          exe=$(sudo readlink "/proc/$pid/exe")
          echo "Running: $exe"
          [[ "$exe" == /snap/"$SNAP_NAME"/* ]] || { echo "::error::the program runs from $exe, not from the snap"; exit 1; }
          xdotool search --name '^Hashi$' getwindowgeometry || { cat app.log; echo "::error::no window called Hashi"; exit 1; }
          [ "$colors" -gt 500 ] || { cat app.log; echo "::error::the window shows no page ($colors colours)"; exit 1; }
          echo "The snap ($ARCH) runs and shows the page" >> "$GITHUB_STEP_SUMMARY"
          kill "$pid"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snap-smoke-${{ matrix.arch }}
          path: smoke
          if-no-files-found: ignore
          retention-days: 7
      - name: Size
        run: |
          mb() { awk -v bytes="$(wc -c < "$1")" 'BEGIN { printf "%.1f MB", bytes / 1048576 }'; }
          {
            echo "| Snap $ARCH $VERSION | size |"
            echo "|---|---|"
            for file in release/*; do echo "| $(basename "$file") | $(mb "$file") |"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: snap-linux-${{ matrix.arch }}
          path: release
          compression-level: 0
          retention-days: ${{ needs.check.outputs.publish == 'true' && 30 || 3 }}

  release:
    name: GitHub release
    needs: [check, android, android-foss, ios, desktop, msstore-package, snap]
    if: >-
      ${{ !cancelled() && ((needs.check.outputs.publish == 'true' && needs.android.result == 'success')
      || (needs.check.outputs.desktop_only == 'true' && needs.desktop.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - if: needs.check.outputs.desktop_only != 'true'
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: release
      - if: needs.android-foss.result == 'success' && needs.android-foss.outputs.built == 'true'
        uses: actions/download-artifact@v8
        with:
          name: android-foss-release
          path: release
      - if: needs.ios.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ios-release
          path: release
      - if: needs.desktop.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      # The MSIX bundle, when it has the Store's identity
      - if: needs.msstore-package.result == 'success' && needs.msstore-package.outputs.identity == 'store'
        uses: actions/download-artifact@v8
        with:
          name: msstore-release
          path: release
      # The snaps, of the architectures that made one
      - if: needs.snap.result != 'skipped' && needs.check.outputs.desktop == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: snap-linux-*
          path: release
          merge-multiple: true
      # Only the desktop: the release's other files for its notes, without its old desktop ones
      - if: needs.check.outputs.desktop_only == 'true'
        name: The release's other files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p others
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D others
          rm -f others/hashi-*-windows-* others/hashi-*-macos-* others/hashi-*-linux-*
          ls others
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
          CODE: ${{ needs.check.outputs.code }}
          DESKTOP_ONLY: ${{ needs.check.outputs.desktop_only }}
          SNAP_NAME: ${{ vars.SNAP_NAME || 'hashi' }}
          MACOS_SIGNED: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 != '' }}
        run: |
          # Every file the release has after this run, for the notes
          files=release
          if [ "$DESKTOP_ONLY" = true ]; then files=$(mktemp -d) && cp release/* others/* "$files"; fi
          has() { compgen -G "$files/$1" > /dev/null; }
          platforms=(Android)
          {
            cat app/store/whatsnew/whatsnew-en-US
            echo
            echo "## Android"
            echo
            echo "- \`hashi-$VERSION.aab\`: the App Bundle uploaded to Google Play (versionCode $CODE)."
            echo "- \`hashi-$VERSION-universal.apk\`: the same app for every architecture, to install by hand."
            echo
            echo "Both are signed with the app's upload key, which only identifies uploads to Google Play;"
            echo "Play signs the app it delivers with its own key. So they're safe to publish, and the APK"
            echo "can't update an app installed from Play (or the other way round): uninstall that first."
            if has "hashi-$VERSION-foss-*.apk"; then
              echo
              echo "## Android without Google (foss)"
              echo
              echo "The app without any proprietary code (no Google Play Games), as in our F-Droid repository:"
              echo "https://noelhuibers.github.io/Hashiwokakero/ has its address and fingerprint, for updates in"
              echo "F-Droid. One APK per processor; nearly every phone wants arm64-v8a."
              echo
              for apk in "$files"/hashi-"$VERSION"-foss-*.apk; do
                echo "- \`$(basename "$apk")\`"
              done
              echo
              echo "They are signed with the app's direct key (not the upload key), so they don't update an app"
              echo "from Google Play or the APK above, nor the other way round."
            fi
            if has "hashi-$VERSION.ipa"; then
              platforms+=(iOS)
              echo
              echo "## iOS"
              echo
              echo "- \`hashi-$VERSION.ipa\`: the app uploaded to App Store Connect for TestFlight (build $CODE)."
              echo
              echo "It is signed for App Store distribution, so it only installs through TestFlight or the"
              echo "App Store, not by hand."
            fi
            if has "hashi-$VERSION-windows-*" || has "hashi-$VERSION-macos-*" || has "hashi-$VERSION-linux-*"; then
              echo
              echo "## Windows, macOS, Linux"
              echo
              echo "The desktop app, the same as on the phones (without Game Center and Google Play Games)."
              echo
              for file in "$files"/hashi-"$VERSION"-{windows,macos,linux}-*; do
                [ -e "$file" ] || continue
                name=$(basename "$file")
                case "$name" in
                  *-windows-x64-setup.exe) echo "- \`$name\`: Windows (x64), the installer; it needs no admin rights." ;;
                  *-windows-arm64-setup.exe) echo "- \`$name\`: Windows on ARM (arm64), the installer." ;;
                  *-windows-x64.msi) echo "- \`$name\`: Windows (x64) as an MSI package, for installing on many computers." ;;
                  *-windows-store.msixbundle) echo "- \`$name\`: the package uploaded to the Microsoft Store (x64 and arm64). Microsoft signs it there, so it doesn't install by hand." ;;
                  *-macos-universal.dmg) echo "- \`$name\`: macOS 11 or newer, Apple silicon and Intel." ;;
                  *-macos-universal.app.zip) echo "- \`$name\`: the same Mac app, zipped." ;;
                  *-linux-*.AppImage) echo "- \`$name\`: Linux, runs on most distributions without installing (chmod +x)." ;;
                  *-linux-*.deb) echo "- \`$name\`: Debian, Ubuntu and their kin." ;;
                  *-linux-*.rpm) echo "- \`$name\`: Fedora, openSUSE and their kin." ;;
                  *-linux-*.snap) echo "- \`$name\`: the snap uploaded to the Snap Store. Install it from there (\`snap install $SNAP_NAME\`), which updates it; this file installs only with --dangerous, and never updates." ;;
                  *) echo "- \`$name\`" ;;
                esac
              done
              echo
              echo "The Windows installers aren't signed yet: SmartScreen warns about an unknown publisher (More info,"
              echo "Run anyway)."
              if [ "$MACOS_SIGNED" = true ]; then
                echo "The Mac app is signed with our Developer ID and notarized by Apple."
              else
                echo "The Mac app isn't notarized yet: macOS refuses to open it at first; allow it in System Settings,"
                echo "Privacy & Security, Open Anyway."
              fi
              for system in Windows macOS Linux; do
                if has "hashi-$VERSION-${system,,}-*"; then platforms+=("$system"); fi
              done
            fi
          } > notes.md
          title="Hashi $VERSION ($(printf '%s, ' "${platforms[@]}" | sed 's/, $//'))"
          # A re-run replaces the files and adds the IPA's and the desktop's notes
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "$title" --notes-file notes.md
          else
            gh release create "$TAG" release/* --verify-tag --prerelease --title "$title" --notes-file notes.md
          fi

  # Our F-Droid repository (app/README.md, F-Droid repository), on GitHub Pages: the foss APKs of
  # the last KEEP_VERSIONS versions, which the GitHub releases keep (Pages keeps nothing from one
  # deployment to the next), the store listings' texts in every locale, the icon, and the phone
  # screenshots from the newest "Store listing" run on main that still has them, else those the
  # published repository has. Its index is signed with the F-Droid index key (FDROID_*), not the
  # APKs' key. A release publishes it once the GitHub release has the APKs; a dry run builds it
  # from this run's APKs (and the releases') and keeps it as an artifact; `fdroid` publishes it
  # again from the releases alone. Skipped with a notice without the index key, and not published
  # while GitHub Pages isn't on (Settings, Pages, Source: GitHub Actions).
  fdroid:
    name: F-Droid repository
    needs: [check, android-foss, release]
    if: >-
      ${{ !cancelled() && (needs.check.outputs.fdroid == 'true'
      || (needs.android-foss.result == 'success' && needs.android-foss.outputs.built == 'true'
      && (needs.check.outputs.publish != 'true' || needs.release.result == 'success'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # The images of a "Store listing" run
      actions: read
      # Whether GitHub Pages is on
      pages: read
    outputs:
      deploy: ${{ steps.site.outputs.deploy }}
    env:
      FDROIDSERVER_VERSION: 2.4.5
      REPO_URL: https://noelhuibers.github.io/Hashiwokakero/fdroid/repo
      # This version and the one before: about 27 MB per ABI and version
      KEEP_VERSIONS: 2
      PUBLISH: ${{ needs.check.outputs.publish == 'true' || needs.check.outputs.fdroid == 'true' }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      # Node 26 runs scripts/fdroid-repo.ts
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # keytool, and jar for fdroidserver's index
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # The index key in the working directory, gone at the end of the job (below). fdroidserver
      # reads the passwords from the environment (app/fdroid/config.yml).
      - id: key
        name: Index key
        env:
          KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          # fdroidserver's working directory (scripts/fdroid-repo.ts)
          WORK="$RUNNER_TEMP/fdroid"
          mkdir -m 700 "$WORK"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$WORK/keystore.p12"
          elif [ "$PUBLISH" = true ]; then
            echo "::notice::No F-Droid index key in this run's secrets (FDROID_KEYSTORE_BASE64, FDROID_KEYSTORE_PASSWORD, FDROID_KEY_ALIAS, FDROID_KEY_PASSWORD), the F-Droid repository isn't published"
            echo "No F-Droid index key in this run's secrets, the F-Droid repository isn't published (once they are set: \`gh workflow run app-release.yml -f fdroid=true\`)." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "::notice::No F-Droid index key in this run's secrets, signed with a throwaway key"
            KEYSTORE_PASSWORD=$(openssl rand -hex 16) KEY_ALIAS=hashi-fdroid
            KEY_PASSWORD=$KEYSTORE_PASSWORD
            keytool -genkeypair -keystore "$WORK/keystore.p12" -storetype PKCS12 -alias "$KEY_ALIAS" -keyalg RSA \
              -validity 1 -dname "CN=Throwaway" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1
          fi
          echo "FDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          # Passed on through files: the passwords never go into $GITHUB_ENV
          printf '%s\n' "$KEYSTORE_PASSWORD" > "$WORK/store-password"
          printf '%s\n' "$KEY_PASSWORD" > "$WORK/key-password"
          # The fingerprint that users pin, uppercase hex: the SHA-256 of the key's certificate
          fingerprint=$(keytool -list -v -keystore "$WORK/keystore.p12" -alias "$KEY_ALIAS" -storepass:file "$WORK/store-password" \
            | sed -n 's/^\s*SHA256: //p' | tr -d :)
          [ -n "$fingerprint" ] || { echo "::error::No fingerprint of the F-Droid index key"; exit 1; }
          echo "FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.ready == 'true'
        name: fdroidserver
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "fdroidserver==$FDROIDSERVER_VERSION"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      # The phone screenshots and feature graphics of the newest "Store listing" run on main whose
      # artifact is still there (pull requests' runs may show listings that never got merged)
      - if: steps.key.outputs.ready == 'true'
        id: images
        name: Store images
        run: |
          id=$(gh api "repos/$REPO/actions/artifacts?name=store-listing-images&per_page=100" \
            --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "main")][0].id // empty')
          if [ -z "$id" ]; then
            echo "No store images of main at hand, the published repository's screenshots are kept" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api "repos/$REPO/actions/artifacts/$id/zip" > "$RUNNER_TEMP/images.zip"
          unzip -q "$RUNNER_TEMP/images.zip" '*/play-phone/*' '*/feature.png' -d "$RUNNER_TEMP/store-images"
          rm "$RUNNER_TEMP/images.zip"
          echo "dir=$RUNNER_TEMP/store-images" >> "$GITHUB_OUTPUT"
          echo "Screenshots from the store images of artifact $id" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.key.outputs.ready == 'true'
        name: Metadata
        env:
          IMAGES: ${{ steps.images.outputs.dir }}
        run: node scripts/fdroid-repo.ts "$WORK" ${IMAGES:+--images "$IMAGES"} --carry "$REPO_URL"
      - if: steps.key.outputs.ready == 'true' && env.PUBLISH != 'true'
        uses: actions/download-artifact@v8
        with:
          name: android-foss-release
          path: ${{ runner.temp }}/foss
      # A dry run: this run's APKs, and those of the releases before. Publishing: the releases'
      # alone, this one's included. Each dated by its release (fdroid update --use-date-from-apk),
      # not by this run: the repository is made anew every time.
      - if: steps.key.outputs.ready == 'true'
        name: APKs
        run: |
          have=0
          if [ "$PUBLISH" != true ]; then
            cp "$RUNNER_TEMP"/foss/hashi-*-foss-*.apk "$WORK/repo/"
            have=1
          fi
          # Newest first
          gh api "repos/$REPO/releases?per_page=100" \
            --jq '.[] | select((.draft | not) and (.tag_name | startswith("app-v"))) | select(any(.assets[]; .name | test("-foss-.+\\.apk$"))) | "\(.tag_name) \(.published_at)"' \
            > "$RUNNER_TEMP/releases"
          while read -r tag published && [ "$have" -lt "$KEEP_VERSIONS" ]; do
            gh release download "$tag" -R "$REPO" -p 'hashi-*-foss-*.apk' -D "$WORK/repo"
            touch -d "$published" "$WORK/repo/hashi-${tag#app-v}"-foss-*.apk
            have=$((have + 1))
          done < "$RUNNER_TEMP/releases"
          if [ "$have" -eq 0 ]; then
            echo "::error::No foss APKs on the GitHub releases"
            exit 1
          fi
          ls -l "$WORK/repo"
      # fdroidserver's own check for proprietary code and trackers, then the index
      - if: steps.key.outputs.ready == 'true'
        name: fdroid update
        working-directory: ${{ runner.temp }}/fdroid
        run: |
          FDROID_KEYSTORE_PASSWORD=$(cat store-password) FDROID_KEY_PASSWORD=$(cat key-password)
          export FDROID_KEYSTORE_PASSWORD FDROID_KEY_PASSWORD
          fdroid scanner --exit-code repo/*.apk
          fdroid update --use-date-from-apk
          test -s repo/index-v2.json && test -s repo/entry.jar
      - if: always()
        name: Remove the index key
        run: rm -f "$WORK/keystore.p12" "$WORK/store-password" "$WORK/key-password"
      # The site: the repository under fdroid/repo, a start page with its address and fingerprint.
      # Published by a release or `fdroid`, when GitHub Pages is on.
      - if: steps.key.outputs.ready == 'true'
        id: site
        name: Site
        run: |
          mkdir -p _site/fdroid
          cp -r "$WORK/repo" _site/fdroid/repo
          sed -e "s|{{REPO_URL}}|$REPO_URL|g" -e "s|{{HOST_PATH}}|${REPO_URL#https://}|g" -e "s|{{FINGERPRINT}}|$FINGERPRINT|g" \
            app/fdroid/index.html > _site/index.html
          if grep -q '{{' _site/index.html; then echo "::error::A placeholder left in the start page"; exit 1; fi
          {
            echo "F-Droid repository: $REPO_URL?fingerprint=$FINGERPRINT"
            echo
            echo "| APK | versionCode | size |"
            echo "|---|---|---|"
            jq -r '.packages[].versions[] | "| \(.file.name | ltrimstr("/")) | \(.manifest.versionCode) | \(.file.size / 1048576 * 10 | floor / 10) MB |"' \
              "$WORK/repo/index-v2.json"
            echo
            echo "Site: $(du -sh _site | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
          pages=$(gh api "repos/$REPO/pages" --jq .build_type 2> /dev/null || true)
          if [ "$PUBLISH" != true ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "$pages" != workflow ]; then
            echo "::notice::GitHub Pages isn't on with GitHub Actions as its source (Settings, Pages), the F-Droid repository isn't published"
            echo "GitHub Pages isn't on with GitHub Actions as its source, the F-Droid repository isn't published." >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: ${{ env.PUBLISH == 'true' && 7 || 3 }}

  # The site of the job above on GitHub Pages. The environment github-pages allows main and the
  # tags app-v* (Settings, Environments).
  pages:
    name: Publish the F-Droid repository
    needs: fdroid
    if: ${{ !cancelled() && needs.fdroid.outputs.deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # One deployment at a time, never cancelled halfway
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
      - run: echo "Published on ${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"

  # Google Play's internal test track. Skipped until the PLAY_SERVICE_ACCOUNT_JSON secret (the
  # service account's JSON key) is set, and Play only accepts uploads through the API after the
  # first bundle was uploaded by hand (app/README.md, Releases). PLAY_RELEASE_STATUS (a repository
  # variable) can make it a draft, which Play requires while the app itself is still a draft.
  play:
    name: Upload to Google Play
    needs: [check, android]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - if: env.PLAY_SERVICE_ACCOUNT_JSON == ''
        run: |
          echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret, the App Bundle isn't uploaded to Google Play"
          echo "No PLAY_SERVICE_ACCOUNT_JSON secret, the App Bundle isn't uploaded to Google Play. It is on the GitHub release; once the secret is set, run this workflow on the tag with publish." >> "$GITHUB_STEP_SUMMARY"
      - if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: actions/checkout@v7
      - if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: release
      # The native symbols and R8's mapping are in the bundle (BUNDLE-METADATA), Play takes them
      # from there
      - if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: rs.hashi
          releaseFiles: release/hashi-${{ needs.check.outputs.version }}.aab
          releaseName: ${{ needs.check.outputs.version }}
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: app/store/whatsnew
      - if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        run: echo "Uploaded ${{ needs.check.outputs.version }} to Google Play's internal track" >> "$GITHUB_STEP_SUMMARY"

  # The Samsung Galaxy Store (docs/stores.md, Galaxy Store), with scripts/galaxy-store.ts: the foss
  # APKs of the ABIs of Samsung's phones become the binaries of an update of the app (the older
  # ones go), with app/store/whatsnew/whatsnew-en-US as its "what's new", submitted for review. It
  # goes live after the review unless the app is set to manual publication in Seller Portal. The
  # foss build, not Play's: Play Games' sign-in only works with Play's signature, and these are the
  # APKs of F-Droid and the GitHub release, signed with the direct key, which Samsung keeps, so
  # they update each other. Skipped with a notice until the service account's secrets are set
  # (SAMSUNG_SERVICE_ACCOUNT_ID, SAMSUNG_PRIVATE_KEY, SAMSUNG_CONTENT_ID); Samsung's API only updates
  # an app registered by hand. A dry run checks the APKs and the key's use (a throwaway key without
  # the secrets) and calls nobody. Repository variables: GALAXY_STORE_ABIS (default
  # "arm64-v8a armeabi-v7a"), GALAXY_STORE_SUBMIT (false: leave the update for Seller Portal).
  galaxy:
    name: Upload to Galaxy Store
    needs: [check, android-foss]
    if: >-
      ${{ !cancelled() && (needs.check.outputs.galaxy == 'true'
      || (needs.android-foss.result == 'success' && needs.android-foss.outputs.built == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.check.outputs.version }}
      CODE: ${{ needs.check.outputs.code }}
      ABIS: ${{ vars.GALAXY_STORE_ABIS || 'arm64-v8a armeabi-v7a' }}
      SUBMIT: ${{ vars.GALAXY_STORE_SUBMIT != 'false' }}
      UPLOAD: ${{ needs.check.outputs.publish == 'true' || needs.check.outputs.galaxy == 'true' }}
    steps:
      - id: account
        name: Service account
        env:
          SAMSUNG_SERVICE_ACCOUNT_ID: ${{ secrets.SAMSUNG_SERVICE_ACCOUNT_ID }}
          SAMSUNG_PRIVATE_KEY: ${{ secrets.SAMSUNG_PRIVATE_KEY }}
          SAMSUNG_CONTENT_ID: ${{ secrets.SAMSUNG_CONTENT_ID }}
        run: |
          if [ -n "$SAMSUNG_SERVICE_ACCOUNT_ID" ] && [ -n "$SAMSUNG_PRIVATE_KEY" ] && [ -n "$SAMSUNG_CONTENT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$UPLOAD" = true ]; then
            echo "::notice::No Galaxy Store service account in this run's secrets (SAMSUNG_SERVICE_ACCOUNT_ID, SAMSUNG_PRIVATE_KEY, SAMSUNG_CONTENT_ID), nothing is uploaded to the Galaxy Store"
            echo "No Galaxy Store service account in this run's secrets, nothing is uploaded to the Galaxy Store (once they are set: \`gh workflow run app-release.yml --ref app-v$VERSION -f galaxy=true\`)." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Galaxy Store service account in this run's secrets, the dry run uses a throwaway key"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.account.outputs.ready == 'true'
        uses: actions/checkout@v7
      # Node 26 runs scripts/galaxy-store.ts
      - if: steps.account.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - if: steps.account.outputs.ready == 'true' && needs.check.outputs.galaxy != 'true'
        uses: actions/download-artifact@v8
        with:
          name: android-foss-release
          path: release
      - if: steps.account.outputs.ready == 'true' && needs.check.outputs.galaxy == 'true'
        name: The GitHub release's APKs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for abi in $ABIS; do
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "hashi-$VERSION-foss-$abi.apk" -D release
          done
          ls -l release
      - if: steps.account.outputs.ready == 'true'
        name: Upload
        env:
          SAMSUNG_SERVICE_ACCOUNT_ID: ${{ secrets.SAMSUNG_SERVICE_ACCOUNT_ID }}
          SAMSUNG_PRIVATE_KEY: ${{ secrets.SAMSUNG_PRIVATE_KEY }}
          SAMSUNG_CONTENT_ID: ${{ secrets.SAMSUNG_CONTENT_ID }}
        run: |
          args=(release --version "$VERSION" --code "$CODE" --whatsnew app/store/whatsnew/whatsnew-en-US)
          if [ "$SUBMIT" = true ]; then args+=(--submit); fi
          if [ "$UPLOAD" != true ]; then
            args+=(--dry-run)
            if [ -z "$SAMSUNG_PRIVATE_KEY" ]; then
              SAMSUNG_PRIVATE_KEY=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2> /dev/null)
              SAMSUNG_SERVICE_ACCOUNT_ID=throwaway
              export SAMSUNG_PRIVATE_KEY SAMSUNG_SERVICE_ACCOUNT_ID
            fi
          fi
          for abi in $ABIS; do args+=("release/hashi-$VERSION-foss-$abi.apk"); done
          node scripts/galaxy-store.ts "${args[@]}"

  # The Amazon Appstore (docs/stores.md, Amazon Appstore), with scripts/amazon-appstore.ts: the foss
  # APKs replace the binaries of the app's edit (its next version), each the one of its ABI, which
  # keeps the Fire tablets it targets; an ABI the app has no binary of stays out (set up in the
  # Developer Console). The release notes become every language's "recent changes", then the
  # edit is committed, which submits it for review; it goes live after it. The foss build: Fire
  # tablets have no Google services. Amazon re-signs the APKs with its own key for the account.
  # Skipped with a notice until the security profile's secrets are set (AMAZON_CLIENT_ID,
  # AMAZON_CLIENT_SECRET, AMAZON_APP_ID); the API only updates an app submitted once by hand. A
  # dry run checks the APKs and the plan and calls nobody. Repository variable:
  # AMAZON_APPSTORE_SUBMIT (false: leave the edit for the Developer Console).
  amazon:
    name: Upload to Amazon Appstore
    needs: [check, android-foss]
    if: >-
      ${{ !cancelled() && (needs.check.outputs.amazon == 'true'
      || (needs.android-foss.result == 'success' && needs.android-foss.outputs.built == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.check.outputs.version }}
      CODE: ${{ needs.check.outputs.code }}
      # Every Fire tablet is ARM: 64-bit ones and older 32-bit ones
      ABIS: arm64-v8a armeabi-v7a
      SUBMIT: ${{ vars.AMAZON_APPSTORE_SUBMIT != 'false' }}
      UPLOAD: ${{ needs.check.outputs.publish == 'true' || needs.check.outputs.amazon == 'true' }}
    steps:
      - id: account
        name: Security profile
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_APP_ID: ${{ secrets.AMAZON_APP_ID }}
        run: |
          if [ -n "$AMAZON_CLIENT_ID" ] && [ -n "$AMAZON_CLIENT_SECRET" ] && [ -n "$AMAZON_APP_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$UPLOAD" = true ]; then
            echo "::notice::No Amazon Appstore security profile in this run's secrets (AMAZON_CLIENT_ID, AMAZON_CLIENT_SECRET, AMAZON_APP_ID), nothing is uploaded to the Amazon Appstore"
            echo "No Amazon Appstore security profile in this run's secrets, nothing is uploaded to the Amazon Appstore (once they are set: \`gh workflow run app-release.yml --ref app-v$VERSION -f amazon=true\`)." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            # A dry run needs no secrets
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.account.outputs.ready == 'true'
        uses: actions/checkout@v7
      # Node 26 runs scripts/amazon-appstore.ts
      - if: steps.account.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - if: steps.account.outputs.ready == 'true' && needs.check.outputs.amazon != 'true'
        uses: actions/download-artifact@v8
        with:
          name: android-foss-release
          path: release
      - if: steps.account.outputs.ready == 'true' && needs.check.outputs.amazon == 'true'
        name: The GitHub release's APKs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for abi in $ABIS; do
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "hashi-$VERSION-foss-$abi.apk" -D release
          done
          ls -l release
      - if: steps.account.outputs.ready == 'true'
        name: Upload
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_APP_ID: ${{ secrets.AMAZON_APP_ID }}
        run: |
          args=(release --version "$VERSION" --code "$CODE" --whatsnew app/store/whatsnew/whatsnew-en-US)
          if [ "$SUBMIT" = true ]; then args+=(--submit); fi
          if [ "$UPLOAD" != true ]; then args+=(--dry-run); fi
          for abi in $ABIS; do args+=("release/hashi-$VERSION-foss-$abi.apk"); done
          node scripts/amazon-appstore.ts "${args[@]}"

  # Huawei AppGallery (docs/stores.md, Huawei AppGallery), with scripts/huawei-appgallery.ts: the
  # foss APKs of the ABIs of Huawei's phones become the packages of the app's next version (a
  # multi-APK version: each goes to the devices of its CPU architecture), the release notes every
  # language's "new features", the app is marked as not needing Google services, then the version
  # is submitted for review as a full release; it goes live after it. APKs, not an App Bundle:
  # AppGallery distributes an APK as we signed it (the direct key), so the app updates from and to
  # F-Droid, the GitHub release and the Galaxy Store. Skipped with a notice until the Service
  # Account's secret is set (HUAWEI_SERVICE_ACCOUNT_JSON); the app is created by hand first. A dry
  # run checks the APKs and the key's use (a throwaway key without the secret) and calls nobody.
  # Repository variables: HUAWEI_APPGALLERY_ABIS (default "arm64-v8a armeabi-v7a"),
  # HUAWEI_APPGALLERY_SUBMIT (false: leave the version for AppGallery Connect).
  huawei:
    name: Upload to Huawei AppGallery
    needs: [check, android-foss]
    if: >-
      ${{ !cancelled() && (needs.check.outputs.huawei == 'true'
      || (needs.android-foss.result == 'success' && needs.android-foss.outputs.built == 'true')) }}
    runs-on: ubuntu-24.04
    # app-submit waits up to ten minutes for AppGallery to parse the APKs
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.check.outputs.version }}
      CODE: ${{ needs.check.outputs.code }}
      ABIS: ${{ vars.HUAWEI_APPGALLERY_ABIS || 'arm64-v8a armeabi-v7a' }}
      SUBMIT: ${{ vars.HUAWEI_APPGALLERY_SUBMIT != 'false' }}
      UPLOAD: ${{ needs.check.outputs.publish == 'true' || needs.check.outputs.huawei == 'true' }}
    steps:
      - id: account
        name: Service Account
        env:
          HUAWEI_SERVICE_ACCOUNT_JSON: ${{ secrets.HUAWEI_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$HUAWEI_SERVICE_ACCOUNT_JSON" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$UPLOAD" = true ]; then
            echo "::notice::No AppGallery Service Account in this run's secrets (HUAWEI_SERVICE_ACCOUNT_JSON), nothing is uploaded to Huawei AppGallery"
            echo "No AppGallery Service Account in this run's secrets, nothing is uploaded to Huawei AppGallery (once it is set: \`gh workflow run app-release.yml --ref app-v$VERSION -f huawei=true\`)." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No AppGallery Service Account in this run's secrets, the dry run uses a throwaway key"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.account.outputs.ready == 'true'
        uses: actions/checkout@v7
      # Node 26 runs scripts/huawei-appgallery.ts
      - if: steps.account.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - if: steps.account.outputs.ready == 'true' && needs.check.outputs.huawei != 'true'
        uses: actions/download-artifact@v8
        with:
          name: android-foss-release
          path: release
      - if: steps.account.outputs.ready == 'true' && needs.check.outputs.huawei == 'true'
        name: The GitHub release's APKs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for abi in $ABIS; do
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "hashi-$VERSION-foss-$abi.apk" -D release
          done
          ls -l release
      - if: steps.account.outputs.ready == 'true'
        name: Upload
        env:
          HUAWEI_SERVICE_ACCOUNT_JSON: ${{ secrets.HUAWEI_SERVICE_ACCOUNT_JSON }}
        run: |
          args=(release --version "$VERSION" --code "$CODE" --whatsnew app/store/whatsnew/whatsnew-en-US)
          if [ "$SUBMIT" = true ]; then args+=(--submit); fi
          if [ "$UPLOAD" != true ]; then
            args+=(--dry-run)
            if [ -z "$HUAWEI_SERVICE_ACCOUNT_JSON" ]; then
              HUAWEI_SERVICE_ACCOUNT_JSON=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2> /dev/null |
                node -e 'let k = ""; process.stdin.on("data", (d) => (k += d)).on("end", () => console.log(JSON.stringify({ key_id: "throwaway", sub_account: "throwaway", private_key: k })))')
              export HUAWEI_SERVICE_ACCOUNT_JSON
            fi
          fi
          for abi in $ABIS; do args+=("release/hashi-$VERSION-foss-$abi.apk"); done
          node scripts/huawei-appgallery.ts "${args[@]}"

  # The Microsoft Store (docs/stores.md, Microsoft Store), with scripts/microsoft-store.ts: the MSIX
  # bundle (x64 and arm64) becomes the package of the app's next submission (a copy of the
  # published one, or the draft a run before or Partner Center left), its only one; the release
  # notes every language's "what's new"; then the submission is committed, which sends it to
  # Microsoft's certification; it goes live after it. A game in the Store has to be an MSIX
  # package, installed and updated by the Store only (Store Policies 10.2.5): no self-updating.
  # Skipped with a notice until the Entra application's secrets are set (MS_STORE_TENANT_ID,
  # MS_STORE_CLIENT_ID, MS_STORE_CLIENT_SECRET) and the variable MS_STORE_APP_ID (the Store ID);
  # the API only makes the submissions after the first, which is made in Partner Center. A dry
  # run checks the bundle and calls nobody. Repository variable: MS_STORE_SUBMIT (false: leave
  # the submission as a draft for Partner Center).
  msstore:
    name: Upload to Microsoft Store
    needs: [check, msstore-package]
    if: >-
      ${{ !cancelled() && (needs.check.outputs.msstore == 'true'
      || needs.msstore-package.result == 'success') }}
    runs-on: ubuntu-24.04
    # The commit waits up to 20 minutes for Microsoft to take the submission
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BUNDLE: hashi-${{ needs.check.outputs.version }}-windows-store.msixbundle
      SUBMIT: ${{ vars.MS_STORE_SUBMIT != 'false' }}
      UPLOAD: ${{ needs.check.outputs.publish == 'true' || needs.check.outputs.msstore == 'true' }}
      MS_STORE_APP_ID: ${{ vars.MS_STORE_APP_ID }}
      MS_STORE_IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
      MS_STORE_PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
      MS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}
      MS_STORE_DISPLAY_NAME: ${{ vars.MS_STORE_DISPLAY_NAME }}
    steps:
      - id: account
        name: Entra application
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
        run: |
          if [ -n "$MS_STORE_TENANT_ID" ] && [ -n "$MS_STORE_CLIENT_ID" ] && [ -n "$MS_STORE_CLIENT_SECRET" ] && [ -n "$MS_STORE_APP_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$UPLOAD" = true ]; then
            echo "::notice::No Microsoft Store Entra application in this run's secrets (MS_STORE_TENANT_ID, MS_STORE_CLIENT_ID, MS_STORE_CLIENT_SECRET) or no MS_STORE_APP_ID variable, nothing is uploaded to the Microsoft Store"
            echo "No Microsoft Store Entra application in this run's secrets (or no MS_STORE_APP_ID variable), nothing is uploaded to the Microsoft Store (once they are set: \`gh workflow run app-release.yml --ref app-v$VERSION -f msstore=true\`)." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            # A dry run needs no secrets
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.account.outputs.ready == 'true'
        uses: actions/checkout@v7
      # Node 26 runs scripts/microsoft-store.ts
      - if: steps.account.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - if: steps.account.outputs.ready == 'true' && needs.check.outputs.msstore != 'true'
        uses: actions/download-artifact@v8
        with:
          name: msstore-release
          path: release
      - if: steps.account.outputs.ready == 'true' && needs.check.outputs.msstore == 'true'
        name: The GitHub release's bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$BUNDLE" -D release
          ls -l release
      - if: steps.account.outputs.ready == 'true'
        name: Upload
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
        run: |
          args=(release --version "$VERSION" --whatsnew app/store/whatsnew/whatsnew-en-US)
          if [ "$SUBMIT" = true ]; then args+=(--submit); fi
          if [ "$UPLOAD" != true ]; then args+=(--dry-run); fi
          node scripts/microsoft-store.ts "${args[@]}" "release/$BUNDLE"

  # The Snap Store (docs/stores.md, Snap Store), with scripts/snap-store.ts and snapcraft: each
  # architecture's snap is uploaded and released into the channel (the repository variable
  # SNAP_CHANNEL, stable without it) once the store's automatic review passes; snapd then updates
  # every installed snap within hours. A rerun uploads nothing twice (a revision of this version
  # the store has is released instead). Skipped with a notice until snapcraft's login is in the
  # secrets (SNAPCRAFT_STORE_CREDENTIALS, `snapcraft export-login`); the snap's name (SNAP_NAME)
  # is registered by hand. A dry run checks the snaps and calls nobody.
  snapstore:
    name: Upload to Snap Store
    needs: [check, snap]
    if: >-
      ${{ !cancelled() && (needs.check.outputs.snap == 'true'
      || needs.snap.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.check.outputs.version }}
      SNAP_NAME: ${{ vars.SNAP_NAME || 'hashi' }}
      CHANNEL: ${{ vars.SNAP_CHANNEL || 'stable' }}
      UPLOAD: ${{ needs.check.outputs.publish == 'true' || needs.check.outputs.snap == 'true' }}
    steps:
      - id: account
        name: Snapcraft login
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -n "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$UPLOAD" = true ]; then
            echo "::notice::No snapcraft login in this run's secrets (SNAPCRAFT_STORE_CREDENTIALS), nothing is uploaded to the Snap Store"
            echo "No snapcraft login in this run's secrets, nothing is uploaded to the Snap Store (once it is set: \`gh workflow run app-release.yml --ref app-v$VERSION -f snap=true\`)." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            # A dry run needs no login
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.account.outputs.ready == 'true'
        uses: actions/checkout@v7
      # Node 26 runs scripts/snap-store.ts
      - if: steps.account.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - if: steps.account.outputs.ready == 'true' && needs.check.outputs.snap != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: snap-linux-*
          path: release
          merge-multiple: true
      - if: steps.account.outputs.ready == 'true' && needs.check.outputs.snap == 'true'
        name: The GitHub release's snaps
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "hashi-$VERSION-linux-*.snap" -D release
          ls -l release
      - if: steps.account.outputs.ready == 'true'
        name: Upload
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          command -v unsquashfs > /dev/null || sudo apt-get install -y --no-install-recommends squashfs-tools
          args=(release --version "$VERSION" --channel "$CHANNEL")
          if [ "$UPLOAD" = true ]; then
            sudo snap install snapcraft --classic
          else
            args+=(--dry-run)
          fi
          node scripts/snap-store.ts "${args[@]}" release/hashi-"$VERSION"-linux-*.snap
