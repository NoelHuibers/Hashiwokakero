[package]
name = "backend"
version = "0.1.0"
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.7", features = ["cargo"] }
itertools = "0.15.0"
splr = "0.19.0"
sat_solver = { path = "../sat_solver", default-features = false }
rand = "0.10.3"
