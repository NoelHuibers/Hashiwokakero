[package]
name = "dojo"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The SAT Dojo: benchmark sets, a sandbox for WASI SAT solvers and deterministic scoring"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# Picks the mystery family of a hidden set from its seed (the website does too)
sha2 = "0.11.1"
# The instance hash of the Global Benchmark Database, for community benchmarks
md-5 = "0.11"

# Benchmark generation and answer checking (`bench`)
backend = { path = "../backend", optional = true }
common = { path = "../common", optional = true }
rand = { version = "0.10.3", optional = true }
# Writes the DRAT proofs that back UNSAT labels (the same version as the backend)
splr = { version = "0.19.0", optional = true }
# Archived sets as .tar.gz (`archive`), pure Rust
flate2 = { version = "1.1.10", optional = true, default-features = false, features = ["rust_backend"] }
tar = { version = "0.4.46", optional = true, default-features = false }

# Running submissions (`runner`)
# reexport-wasmparser: the operator list of the cost tables (fuel.rs) is wasmtime's own
wasmtime = { version = "50.0.0", optional = true, default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation", "reexport-wasmparser"] }
wasmtime-wasi = { version = "50.0.0", optional = true, default-features = false, features = ["p1"] }
wasmparser = { version = "0.262", optional = true }
# Calls wasmtime's own WASI functions from the sandbox's wrappers that cap the proof file
wiggle = { version = "=50.0.0", optional = true, default-features = false, features = ["wasmtime"] }

# The worker service (`worker`)
anyhow = { version = "1", optional = true }
axum = { version = "0.8.9", optional = true }
# 0.12: its rustls uses ring, 0.13 needs aws-lc (a C build)
reqwest = { version = "0.12.28", optional = true, default-features = false, features = ["json", "rustls-tls"] }
serde_json = { version = "1.0.154", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

[dev-dependencies]
# Property tests of the DRAT checker and the answer parser (src/tests/props.rs)
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# Old scores in tests of the shared types, which need no feature
serde_json = "1.0.154"
wat = "1"

[features]
default = []
bench = ["dep:backend", "dep:common", "dep:flate2", "dep:rand", "dep:splr", "dep:tar"]
runner = ["bench", "dep:wasmtime", "dep:wasmtime-wasi", "dep:wasmparser", "dep:wiggle", "dep:tokio"]
worker = ["runner", "dep:anyhow", "dep:axum", "dep:reqwest", "dep:serde_json", "dep:tokio"]

# `export` needs `bench`, `run` needs `runner`, `serve` needs `worker`
[[bin]]
name = "dojo"
required-features = ["bench"]

[lints]
workspace = true

[[example]]
name = "gen_time"
required-features = ["runner"]
