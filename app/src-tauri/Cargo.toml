[package]
name = "hashi_tauri"
version = "0.0.2"
edition = "2024"
license = "MIT"
publish = false

# The mobile app: Tauri 2 around the web bundle of ../ (target/app-dist), see ../README.md.
# A workspace of its own with its own Cargo.lock, outside the repository's workspace, so the
# website's builds and CI never compile Tauri or need its system libraries. It is still built
# inside the repository, where .cargo/config.toml applies. Its other member, offline/, is the
# offline practice without Tauri, testable on any machine.
[workspace]
members = ["offline"]

[lib]
# Android loads the app as a shared library (cdylib), iOS links a static one (staticlib); the
# rlib is for main.rs. Not called `hashi_tauri` like the binary, whose files would clash on
# some platforms.
name = "hashi_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
# Builds and links the Swift side of the app's plugin for iOS (build.rs), as tauri-build's own
# tauri-utils does for tauri's
tauri-utils = { version = "2.10.2", features = ["build-2"] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
# Links out of the app in the phone's browser (only https and mailto, capabilities/default.json)
tauri-plugin-opener = "2.7.2"
# App Links: links to some pages of https://hashi.rs open the app (plugins.deep-link in
# tauri.conf.json, the intent filter it writes into the manifest), the page follows them
tauri-plugin-deep-link = "2.6.2"
# Not called here: `tauri::generate_context!` writes the plugins' config of tauri.conf.json as
# serde_json values into the app
serde_json = "1.0.154"
# The offline practice (offline/): generator and solvers natively, in the app's library
hashi_offline = { path = "offline" }

[lints]
workspace = true

# The repository's lints (../../Cargo.toml), repeated: a crate outside its workspace can't
# inherit them
[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"

# As in the repository's Cargo.toml: the generator and the solvers optimized in debug builds too,
# and splr without its debug assertions, which some formulas trip (backend::sat then falls back to
# another solver, which finds other models). With them, the debug APK and the tests of offline/
# would generate other puzzles than the server for some seeds.
[profile.dev.package.backend]
opt-level = 3

[profile.dev.package.sat_solver]
opt-level = 3

[profile.dev.package.splr]
opt-level = 3
debug-assertions = false

# The release build (the store's App Bundle): one optimized library. Speed over size (opt-level
# 3), the generator and the solvers of the offline practice run in it. Without debug info, but
# with its symbol table: Gradle puts that into the bundle for Play's crash reports
# (debugSymbolLevel) and strips it from the library that phones get.
[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
