<!DOCTYPE html>
<html>
  <head>
    <!-- What app::shell (src/app.rs) puts around <App/> on the website, see README.md -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="author" content="Noel Huibers" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- THEME_SCRIPT of src/app.rs, character for character (a test there compares them) -->
    <script>try{var t=localStorage.getItem('hashi.theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
    <!-- Self-hosted, generated by scripts/fonts.mjs, copied from public/ (Trunk.toml) -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- Tailwind, written by the pre_build hook in Trunk.toml -->
    <link data-trunk rel="css" href="../target/app-css/hashi.css" />
    <link
      data-trunk
      rel="rust"
      href="Cargo.toml"
      data-bin="hashi_app"
      data-cargo-profile-release="wasm-release"
      data-wasm-opt="z"
    />
  </head>
  <body></body>
</html>
