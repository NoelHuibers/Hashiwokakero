AntiFeatures:
  TetheredNet:
    en-US: The daily puzzle, rankings, rivals and groups use the developer's server
      hashi.rs (free software, in the same repository), which can't be changed in
      the app. Play works offline.
Categories:
  - Puzzle Game
License: MIT
AuthorName: Noel Huibers
WebSite: https://hashi.rs
SourceCode: https://github.com/NoelHuibers/Hashiwokakero
IssueTracker: https://github.com/NoelHuibers/Hashiwokakero/issues
Changelog: https://github.com/NoelHuibers/Hashiwokakero/releases

AutoName: Hashi

RepoType: git
Repo: https://github.com/NoelHuibers/Hashiwokakero.git

Builds:
  - versionName: 1.1.0
    versionCode: 10010001
    commit: COMMIT
    timeout: 18000
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y build-essential cmake curl pkg-config rustup xz-utils
    output: 
      app/src-tauri/gen/android/app/build/outputs/apk/arm/release/app-arm-release-unsigned.apk
    binary: 
      https://github.com/NoelHuibers/Hashiwokakero/releases/download/app-v%v/hashi-%v-foss-armeabi-v7a.apk
    rm:
      - app/src-tauri/gen/android/app/src/play
    prebuild:
      - sed -i -e '/com.google.android.gms/d' app/src-tauri/gen/android/app/build.gradle.kts
      - app/fdroid/build.sh prepare
    scandelete:
      - app/fdroid/third_party/binaryen
      - dojo/reference
      - node_modules
      - public
      - src/golden/files
    build:
      - app/fdroid/build.sh tools
      - app/fdroid/build.sh apk arm
    ndk: 29.0.14206865

